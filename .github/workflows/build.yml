# SPDX-License-Identifier: Apache-2.0
name: Build

# Every checkout that could configure the project passes `fetch-depth: 0`, and
# that is load-bearing rather than habit: the version comes from `git describe`
# (cmake/Version.cmake), and the default depth-1 checkout fetches no tags, so it
# would silently yield the fallback version — and, in the packaging jobs, packages
# named after a release nobody cut. Full history rather than `fetch-tags: true`
# because a build off a branch has to describe against real history, and fetching
# a tag into a depth-1 clone leaves the tagged commit as an unrelated shallow root
# that describe cannot reach. YAML cannot factor a step input out, so the input is
# repeated per job while the reason is stated once, here.
#
# Some of those checkouts are inert and deliberately kept uniform anyway, because
# telling them apart at a glance is not possible and guessing wrong is silent:
# `check-clang-format` only lists and formats files, `docker` builds the version
# inside the image, where .dockerignore excludes .git/ so CMake always takes the
# fallback path, and the smoke jobs download prebuilt binaries instead of
# configuring anything.
#
# Two jobs are the stated exception and pass no fetch-depth at all —
# `check-release-gate` and `release`. Both exist to read this file rather than to
# build it, so history would buy them nothing, and a release must not be able to
# fail on a clone parameter that cannot affect its outcome.
on:
  push:
    branches: [master, "fix-ci"]
    # A release is a numeric triple and nothing else: CMakeLists.txt feeds the tag
    # straight into project(VERSION ...), which rejects anything that is not
    # X.Y.Z — so v0.1.0-rc1 would fail configure in every job and burn a macOS
    # notarization slot before saying so. Encoding the shape here means a mistyped
    # or not-yet-supported tag costs nothing instead of an hour, and it is the one
    # place that records why an rc tag cannot build yet.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # NO `branches:` filter, and its absence is load-bearing rather than an
  # omission. It read `branches: [master]`, which is the **third door** to the
  # never-arrives failure this file already records twice.
  #
  # A pull request whose base is another branch -- which is every layer of a
  # STACKED pull request but the bottom one -- matched no branch, so this workflow
  # produced no check run at all. Not a failing one: none. Every required context
  # then stayed pending forever and the pull request sat at BLOCKED with nothing
  # anywhere saying why, exactly as a `paths-ignore` filter does and exactly as a
  # missing `merge_group:` row does. Measured on #414, #415 and #416: the label
  # workflow reported (it filters no branches) while every build context was
  # simply absent, so the pull request looked like it was waiting on CI that had
  # never been asked to run.
  #
  # Dropping the filter rather than widening it to a branch namespace: a filter
  # that has to be kept in step with how anybody happens to name a branch is a
  # filter that will be wrong again, and the rulebook's answer to exactly this is
  # to gate at the JOB level instead, where a skipped job still REPORTS. That
  # gating is already here -- `scripts/ci-scope.sh` decides it and every job
  # consults it -- so the filter was buying nothing that the jobs do not already
  # decide for themselves.
  pull_request:
  # The merge queue's event, and the whole reason #351 was not a ruleset
  # checkbox. Without this row every required context in this file would simply
  # never report inside a queue, and a queued pull request would sit there
  # forever rather than fail -- the identical never-arrives failure as a
  # `paths-ignore` filter on a required check, arriving through a different door.
  # A queue that enables cleanly and then hangs on a context nothing produces
  # presents as the feature working until the first pull request enters it.
  #
  # `branches:` filters on the queue's BASE ref, so this says the same "only for
  # master" as the `pull_request` row above.
  merge_group:
    branches: [master]

concurrency:
  # Inside a queue `github.ref` is the temporary branch
  # `refs/heads/gh-readonly-queue/master/pr-<n>-<sha>`, which is unique per queue
  # entry -- so `cancel-in-progress` cannot make one entry cancel another. That
  # is load-bearing rather than incidental: a group key that collapsed the
  # entries together would cancel the very run the queue is waiting on, and a
  # cancelled required context is not a reported one. Anything that changes this
  # key has to keep queue entries apart.
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  # Every ctest invocation in this file, and any added later -- which is the
  # reason it is an environment variable rather than a `--parallel` on each of
  # the four `run:` lines that exist today.
  #
  # Four because that is what a GitHub-hosted runner has (macos-14 has three, and
  # oversubscribing a suite of short single-threaded processes by one costs
  # nothing). Safe because every TEST_CASE is already its own process and the
  # tests that genuinely cannot share -- a daemon, a fixed port -- carry
  # RUN_SERIAL; the fixtures that could not, because they named a scratch
  # directory from a per-process counter, are what `tests/ScratchPath.hpp` fixed.
  # Serial CI is also precisely why that bug survived five times.
  #
  # Measured locally on the full suite: 649s -> 131s at eight jobs.
  CTEST_PARALLEL_LEVEL: 4
  CLANG_TOOLS_VERSION: "22"
  GCC_VERSION: "14"
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
  # Read by every packaging job's configure step. ON turns "no reachable tag"
  # from a warning into a configure failure (cmake/Version.cmake), so a silently
  # broken tag fetch fails in the job that would have built the artifact instead
  # of shipping packages named after a release nobody cut. Hardcoding ON would
  # fail every branch and pull-request run, where no tag is reachable by design —
  # hence the expression, and hence it lives here: one value, three consumers,
  # spelled once so they cannot drift apart.
  FASTCACHED_REQUIRE_EXACT_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && 'ON' || 'OFF' }}

jobs:
  # Two jobs in one, and deliberately so. The clang-format sweep is scope-gated
  # like every other compiler job; the doc-subject checks below are NOT, and that
  # is #687.
  #
  # `name:` is `Check C++ style`, which is one of the eleven contexts the
  # `default-master` ruleset requires. It is a wire constant in every sense that
  # matters: renaming it renames a required context, the ruleset then waits on a
  # name nothing produces, and every branch becomes unmergeable. Do not touch it.
  #
  # ## Why a documentation check lives in a job named for C++ style
  #
  # It has to run where all four of these hold at once, and this is the only job
  # in the file where they do.
  #
  #   * It must not be a NEW job. `check-release-gate` asserts that every job
  #     here appears in `release.needs`, so a new one gates the release too --
  #     which is the constraint `merge-queue-contexts` documents and the reason
  #     the clang-tidy job reports through a STEP rather than a sibling job.
  #   * It must report on `pull_request` AND on `merge_group`, or it is the
  #     never-arrives failure this file already records three times.
  #   * It must actually GATE. A doc check in an unrequired job is #684 -- a
  #     failure reported nowhere, on a pull request that merges green -- and
  #     fixing #687 by reintroducing #684 one file over is not a fix. Reporting
  #     and gating are different properties and this needs the second.
  #   * And it must run when `code=false`, because a docs-only change is the one
  #     change these checks exist to catch and the one they were never run on.
  #
  # So the job's own condition is now just `!cancelled()` and the scope gate moved
  # onto the clang-format steps -- exactly the shape `linux`, `windows` and
  # `macos` already use, for the same reason: the job must report under its real
  # name whatever the classifier said, and the steps decide whether any work
  # happens. What changes for a docs-only pull request is that this context now
  # reports success or FAILURE where it used to report `skipped`, and a skipped
  # required context is read by the ruleset as passing.
  #
  # Measured on this tree: the three doc-subject checks cost 0.94 s wall clock
  # together, so what a docs-only run now pays is one runner start.
  check-clang-format:
    name: "Check C++ style"
    runs-on: ubuntu-24.04
    needs: changes
    # `!cancelled()` alone, so a FAILED `changes` cannot skip this job before its
    # steps are consulted -- and so the doc-subject step below runs on the
    # docs-only pull requests the classifier answers `code=false` for.
    if: ${{ !cancelled() }}
    steps:
      # Ungated: both halves of this job need the tree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The doc-subject checks run FIRST and unconditionally. First because they
      # cost under a second and installing clang-format costs a minute, so on a
      # docs-only run the job answers without ever reaching the download.
      #
      # `scripts/doc-subject-checks.sh` derives what to run from the `docs-subject`
      # ctest label in `src/tests/CMakeLists.txt` and refuses when that scan
      # matches nothing -- a doc-check step that runs zero checks reports green,
      # which is #687 one level up. Its verdicts are driven by
      # `ctest -R doc-subject-checks-selftest`; that this step is UNGATED is
      # asserted by `ctest -R gated-jobs-fail-safe`, because gating it is the
      # whole defect.
      - name: "Doc-subject checks (#687: these run on docs-only changes too)"
        run: scripts/doc-subject-checks.sh

      - name: "Install clang-format"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.CLANG_TOOLS_VERSION }}
          sudo apt-get install -y clang-format-${{ env.CLANG_TOOLS_VERSION }}
      - name: "Run clang-format"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: |
          git ls-files '*.h' '*.hpp' '*.cpp' \
            | xargs clang-format-${{ env.CLANG_TOOLS_VERSION }} --dry-run --Werror --style=file

  # The release job gates on every other job in this workflow, and that list is
  # hand-written. This is what keeps it honest — and it runs on every push and
  # pull request, not only on a tag: the mistake it catches (adding a job and
  # forgetting to gate the release on it) is made in a pull request, so a check
  # that could only fail during a release would report it an hour late, after the
  # tag was already pushed. `check-release-gate` is itself a row in
  # `release.needs`, so this job's own failure stops a release too.
  #
  # No fetch-depth: 0 — this reads one file out of the checkout and configures
  # nothing, so it needs no tags and no history.
  check-release-gate:
    name: "Check the release gate covers every job"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: "Assert every job in this workflow gates the release"
        run: |
          set -euo pipefail
          # yq is preinstalled on the ubuntu-24.04 image. If it ever is not, that
          # must fail here: a check that silently skips verifies nothing.
          command -v yq >/dev/null || { echo "::error::yq is required to verify the release gate"; exit 1; }
          workflow=.github/workflows/build.yml
          yq '.jobs | keys | .[]' "$workflow" | grep -vx release | sort > "$RUNNER_TEMP/jobs.txt"
          yq '.jobs.release.needs[]' "$workflow" | sort > "$RUNNER_TEMP/gates.txt"
          missing="$(comm -23 "$RUNNER_TEMP/jobs.txt" "$RUNNER_TEMP/gates.txt")"
          if [[ -n "$missing" ]]; then
            echo "::error::these jobs do not gate the release; add them to release.needs:"
            echo "$missing"
            exit 1
          fi
          echo "all $(wc -l < "$RUNNER_TEMP/jobs.txt") sibling jobs gate this release"

  # What this change can affect, decided once and read by every job below.
  #
  # A pull request touching only `docs/`, `.agent/` or a `*.md` runs no compiler
  # here — but it must still REPORT every required check, and that is the whole
  # difficulty. Master is protected by a ruleset (`default-master`, active) whose
  # required contexts include Windows-cl-release, Windows-clangcl-release,
  # Linux-clang-release, Linux-gcc-release, macOS-clang-release, clang-tidy, the
  # three sccache smokes and Check C++ style. A required context that never
  # reports leaves the pull request waiting on it forever.
  #
  # So this is deliberately NOT `on: paths-ignore`. That filter stops the
  # workflow from triggering at all, no check run is ever created, and "slow"
  # becomes "unmergeable". A job-level `if:` is a different mechanism: the job is
  # created and reports a `skipped` conclusion, which a required check accepts.
  #
  # Note also `strict_required_status_checks_policy: true` on that ruleset —
  # branches must be up to date before merging. Every merge therefore puts every
  # other open pull request behind and forces a rebase and a full re-run, so the
  # matrix is not paid once per pull request but once per pull request per merge
  # that lands while it is open. That multiplier is the larger half of why this
  # job exists.
  #
  # The classification lives in `scripts/ci-scope.sh` rather than inline, so it is
  # testable without a runner (`ctest -R ci-scope`) and so the path table is one
  # list rather than a YAML glob nobody can exercise. Every way of not knowing --
  # an unresolvable ref, a failed diff, an empty diff, a path matching no row --
  # resolves to `code=true`, for the reason `scripts/tidy-sweep.sh` states about
  # its own base ref: "we could not tell what changed" must never read as
  # "nothing did".
  changes:
    name: "Decide what this change can affect"
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the classifier diffs against the merge base, which a
          # depth-1 clone does not contain.
          fetch-depth: 0

      # One arm per event, and `merge_group` has its own rather than falling
      # through, because it reached the right answer here by accident and an
      # accidentally-correct behaviour is one refactor away from being an
      # accidentally-wrong one (#351).
      - id: classify
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              scripts/ci-scope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
              ;;
            merge_group)
              # A merge candidate builds everything, deliberately.
              #
              # It COULD be scoped: `merge_group.base_sha...head_sha` is a real
              # diff and this script would classify it. Two reasons not to.
              #
              # A batched group is built on top of the entries ahead of it, so a
              # documentation-only entry stacked behind a code entry has a
              # docs-only diff of its own -- scoping there means reasoning about
              # a batch shape GitHub chooses and can change.
              #
              # And the saving is not the one this queue was added for. The
              # churn #351 measured is the RE-runs forced on every other open
              # branch by `strict_required_status_checks_policy`, not the single
              # run that lands a change. Trading the queue's one guarantee --
              # that what merges is what was tested, against the head it lands on
              # -- for at most one matrix per merged pull request is a bad price.
              echo "merge candidate ${{ github.event.merge_group.head_ref }}: building everything, by design (#351)" >&2
              echo "code=true" | tee -a "$GITHUB_OUTPUT"
              ;;
            *)
              # A push or a tag has no pull-request base to diff against, and
              # inventing one would be guessing. Those events build everything,
              # which is also what makes the `release` job safe: on a tag nothing
              # below is ever skipped.
              echo "not a pull request (${{ github.event_name }}); building everything" >&2
              echo "code=true" | tee -a "$GITHUB_OUTPUT"
              ;;
          esac

  linux:
    name: "Linux-${{ matrix.preset }}"
    runs-on: ubuntu-24.04
    needs: changes
    # A job-level condition on a MATRIX job is the shape #300 warns about, and
    # this is the one form of it that is safe: `!cancelled()` is false only while
    # the RUN is being cancelled, so the matrix always expands and every leg
    # reports under its real name. It is here so that a FAILED `changes` cannot
    # skip this job -- which, being a matrix, would take its per-leg required
    # contexts out of existence entirely. The step conditions below still decide
    # whether any work happens.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        preset: [clang-release, gcc-release]
    steps:
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.code != 'false' }}
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        if: ${{ needs.changes.outputs.code != 'false' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-${{ matrix.preset }}-

      - name: "ccache"
        if: ${{ needs.changes.outputs.code != 'false' }}
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.preset }}
          max-size: 256M

      # libssl-dev + openssl: TLS is built and tested (the tls-smoke CTest uses
      # the openssl CLI) in every platform job, not a dedicated one.
      - name: "Install build tools"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libyaml-cpp-dev libssl-dev openssl

      - name: "Install Clang ${{ env.CLANG_TOOLS_VERSION }}"
        if: ${{ needs.changes.outputs.code != 'false' && (startsWith(matrix.preset, 'clang')) }}
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.CLANG_TOOLS_VERSION }}
          sudo apt-get install -y clang-${{ env.CLANG_TOOLS_VERSION }} libc++-${{ env.CLANG_TOOLS_VERSION }}-dev libc++abi-${{ env.CLANG_TOOLS_VERSION }}-dev
          sudo ln -sf /usr/bin/clang-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang++

      - name: "Install GCC ${{ env.GCC_VERSION }}"
        if: ${{ needs.changes.outputs.code != 'false' && (startsWith(matrix.preset, 'gcc')) }}
        run: |
          sudo apt-get install -y gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }}
          sudo ln -sf /usr/bin/gcc-${{ env.GCC_VERSION }} /usr/local/bin/gcc
          sudo ln -sf /usr/bin/g++-${{ env.GCC_VERSION }} /usr/local/bin/g++

      # Benchmarks on so fastcache-bench is compiled rather than only ever built
      # by hand from bench/inproc_bench.py. It is not installed and runs no test
      # — this is purely so a refactor of CacheEngine, LruMode or
      # InMemoryLruStorage cannot silently rot a target nothing else compiles.
      #
      # The test client is on for exactly the same reason, and it is why that
      # reason is worth stating twice: it is also default-OFF, no job built it,
      # and it had silently stopped compiling on POSIX altogether — send and
      # recv undeclared, a shell-string popen, and a `store` hardcoded to MSVC
      # flags (issue #84). A target nothing compiles is a target that rots, and
      # that is what it looks like when nobody notices.
      - name: "Configure"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: >-
          cmake --preset ${{ matrix.preset }} -DFASTCACHED_ENABLE_TLS=ON
          -DFASTCACHED_BUILD_BENCHMARKS=ON -DFASTCACHED_BUILD_TESTCLIENT=ON

      - name: "Build"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: cmake --build --preset ${{ matrix.preset }}

      - name: "Test"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: ctest --preset ${{ matrix.preset }}

      # Both binaries the smoke jobs drive: the daemon every job starts, and the
      # launcher the compile-cache smoke job points at it. They share a parent
      # directory, so the artifact keeps them side by side at its root.
      - name: "Upload Linux binaries for the smoke jobs"
        if: ${{ needs.changes.outputs.code != 'false' && (matrix.preset == 'clang-release') }}
        uses: actions/upload-artifact@v4
        with:
          name: fastcached-linux
          path: |
            out/build/clang-release/target/fastcached
            out/build/clang-release/target/fastcache-cc
          retention-days: 1
          if-no-files-found: error

  # clang-tidy and the sanitizer suite used to be ONE job, and that job was the
  # entire critical path: 28.6 minutes of a 28.6-minute workflow, because it
  # built more than any other job, ran clang-tidy on every translation unit, and
  # only then ran the full ctest. They are two questions with two answers, so
  # they are two jobs that run at the same time.
  #
  # Caching the build harder was not the fix, and the measurement is worth
  # keeping: on run 33243524509 ccache reported 535 hits out of 592 cacheable
  # calls — 90.4% — and the build step still took 23.8 minutes. **A ccache hit
  # does not skip clang-tidy.** CMake wires the analyser in through
  # `cmake -E __run_co_compile`, which runs the compiler (behind its launcher)
  # and the analyser as two independent commands, so a replayed object buys the
  # compile back and not one second of the analysis. The only way to pay less
  # tidy is to tidy fewer translation units.
  #
  # So this job no longer builds at all. It configures — which is all a compile
  # database needs — and hands the database to `scripts/tidy-sweep.sh`, which
  # sweeps the changed translation units plus every one that transitively
  # includes a changed header. A PUSH — master, `fix-ci` or a tag — is the one
  # event that sweeps everything, and since #554 it is the ONLY one: a pull
  # request and a merge-queue entry both diff-scope, each against its own base.
  # Which base, and why the union still covers master, is at the `Sweep` step.
  # Nightly is deliberately not a third trigger: every push to master already
  # sweeps in full, and a `schedule:` on this workflow would run all twenty jobs
  # to re-answer a question the merge just answered.
  clang-tidy:
    name: "clang-tidy"
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # `issues: write` for the report step at the bottom, and stated HERE rather
    # than at the top of the file so it reaches one job. A job-level block is
    # exhaustive — every scope not named drops to none — so `contents: read` is
    # what `actions/checkout` needs and the two together are the whole list.
    #
    # The reporting could not be a job of its own: `check-release-gate` asserts
    # that every job in this file appears in `release.needs`, and a job that is
    # SKIPPED on a tag push (which a push-failure notifier is, always) skips
    # `release` with it. That is the never-arrives failure this file records three
    # ways, aimed at the release instead of at a required context — so the report
    # is a step inside the job whose failure it reports, which also lets it read
    # `steps.sweep.conclusion` rather than the whole job's result.
    permissions:
      contents: read
      issues: write
    steps:
      # fetch-depth: 0 is load-bearing here for a second reason beyond the one at
      # the top of this file: the sweep diffs against a base it must be able to
      # resolve, and a base it cannot resolve escalates it to a full sweep. Two
      # bases since #554 — the pull request's base BRANCH, and a queue entry's
      # `merge_group.base_sha`, a bare COMMIT. The second is what makes the depth
      # matter rather than merely help: a shallow clone of
      # `gh-readonly-queue/master/pr-N-<sha>` would not contain that commit, and
      # the escalation would then hide the regression as a permanently full sweep
      # in the queue — the cost this change exists to remove, restored silently.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same key as clang-asan-ubsan below: both configure the same preset, so a
      # second entry would only cost the 10 GB repository cache budget twice.
      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-clang-debug-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-clang-debug-

      # No ccache: this job compiles nothing. Restoring and re-uploading a
      # quarter-gigabyte cache to produce a compile database would cost more than
      # the configure it is meant to help.
      - name: "Install build tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libyaml-cpp-dev libssl-dev

      - name: "Install Clang ${{ env.CLANG_TOOLS_VERSION }}"
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.CLANG_TOOLS_VERSION }}
          sudo apt-get install -y clang-${{ env.CLANG_TOOLS_VERSION }} clang-tidy-${{ env.CLANG_TOOLS_VERSION }} libc++-${{ env.CLANG_TOOLS_VERSION }}-dev libc++abi-${{ env.CLANG_TOOLS_VERSION }}-dev
          sudo ln -sf /usr/bin/clang-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang++

      # TLS on so the TlsSocket/TlsContext sources are also clang-tidy-checked,
      # and benchmarks on for the same reason: fastcache-bench is first-party
      # source, so "fix clang-tidy at the source" has to apply to it too, and
      # this is the only job that runs clang-tidy at all.
      #
      # The test client likewise, and here it matters most: three of the five
      # errors that made issue #84 were clang-tidy findings rather than compile
      # failures, so this is the only job in the workflow that can see them.
      #
      # ENABLE_TIDY=OFF because nothing is built here — the preset's
      # CMAKE_CXX_CLANG_TIDY would be inert, and leaving it on would say this job
      # tidies through the build when it does not.
      #
      # CMAKE_CXX_SCAN_FOR_MODULES=OFF is NOT optional and NOT redundant. A
      # module-scanning generator writes `@…modmap` flags into the database that
      # do not exist until the target has been built, so every translation unit
      # fails to parse and reports nothing — a clean sweep that checked no code.
      # CompileCache.cmake turns the scan off by itself, but only when it picks a
      # launcher, and this job installs no ccache for it to pick.
      - name: "Configure"
        run: >-
          cmake --preset clang-debug -DENABLE_TIDY=OFF
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DFASTCACHED_ENABLE_TLS=ON
          -DFASTCACHED_BUILD_BENCHMARKS=ON -DFASTCACHED_BUILD_TESTCLIENT=ON

      # Which translation units the sweep picks is the part of it that can fail
      # SILENTLY: it has no output of its own to be wrong in, it just sweeps too
      # few files and prints a confident count. So it is asserted, against a
      # synthetic tree, before it is trusted — the same reason the sweep itself
      # canaries its binary before believing a clean result.
      - name: "Self-test the sweep's scope computation"
        run: scripts/tidy-sweep.sh --self-test

      # A pull request and a merge-queue entry diff-scope; everything else sweeps
      # everything, which today is the `push` and nothing else. Why that is sound,
      # what it costs and what it buys are one bullet in *What CI costs* in
      # `.agent/rules/build-and-toolchain.md` — pointed at rather than summarised,
      # because the last two figures written down in this file went stale while
      # reading as current fact. What is here is only what a reader AT THIS STEP
      # cannot get from there.
      #
      # The guard NAMES THE TWO DIFF-SCOPED EVENTS and excludes them, rather than
      # naming `push` and including it, and the difference is which way an
      # unforeseen trigger falls. `on:` is contemplated growing — the comment above
      # this job says a nightly is *deliberately* not a third trigger — and under an
      # `== 'push'` guard a `schedule:` or a `workflow_dispatch:` added later would
      # diff-scope against `origin/master`. On master that diff is EMPTY, so the
      # sweep prints `no source changed` and exits 0: a green check that analysed
      # nothing, which is the verdict `tidy-sweep.sh`'s own header exists to make
      # impossible. Spelled as an exclusion, a trigger nobody thought of gets the
      # full sweep — slow, never wrong, and `ci-scope.sh`'s principle rather than
      # its inverse. `ctest -R tidy-sweep-scope` refuses the inclusive spelling.
      #
      # BASE in a queue is the event's own `base_sha`, which is the head of the
      # entry AHEAD of this one, not master: the queue stacks, and the branch names
      # say so — `pr-546-f209cf1c…` ran at head `d483441a`, which is the base of
      # `pr-551-d483441a…`. So each entry sweeps its own change against a tree that
      # already carries the entries before it, which is the scope that composes.
      #
      # `tidy-sweep.sh` reads BASE only through `git rev-parse --verify` and
      # `git diff BASE...HEAD`, both of which take a raw SHA, and `fetch-depth: 0`
      # above puts it in the clone. A BASE it cannot RESOLVE makes it sweep
      # EVERYTHING — `ci-scope.sh`'s own principle, already inside the script.
      #
      # That covers the absent and the malformed, and it is deliberately not the
      # stronger claim, because the script has a second exit: a base that resolves
      # but whose diff holds no source prints `no source changed` and exits 0,
      # having analysed nothing. That is CORRECT for what reaches it here — a
      # docs-only entry has nothing to tidy, exactly as its own pull-request run
      # found — but it is the one direction that does not escalate, so a future
      # change to how BASE is derived has to be judged against it rather than
      # against the resolve check.
      #
      # This does NOT contradict the `changes` job's refusal to scope a queue
      # entry, which stands. That job decides whether a JOB RUNS AT ALL, where a
      # wrong answer is a required context reporting green over code nothing
      # compiled, and its stated reason is that it will not reason about a batch
      # shape GitHub chooses. This decides how WIDE one analysis is, over a tree
      # that is being fully built either way, and the only way of being wrong about
      # the batch shape that this step can PRODUCE is a base it cannot resolve,
      # which escalates. Not the general claim that being wrong escalates — the
      # paragraph above says exactly where that stops holding.
      #
      # `github.base_ref` is empty on a push, where `--all` is passed anyway and
      # BASE is never read. It is ALSO empty on a `merge_group`, where `--all` is
      # not passed — so the `format(...)` fallback is what a missing or renamed
      # `merge_group.base_sha` lands on there, and it lands on `origin/master`,
      # which resolves and over-approximates. That is the whole reason the default
      # is `master` rather than a bare `origin/`: the two expressions on this step
      # do not have to agree to be correct.
      - name: "Sweep"
        id: sweep
        env:
          TIDY: clang-tidy-${{ env.CLANG_TOOLS_VERSION }}
          DB: out/build/clang-debug
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref || 'master') }}
        run: >-
          scripts/tidy-sweep.sh
          ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') && '--all' || '' }}

      # The step above is now the only full sweep, and a master push blocks nothing
      # and reaches nobody — measured three ways, recorded in the same rulebook
      # bullet. A check nobody reads is a check that does not exist, so moving one
      # onto that path means putting a reader on it.
      #
      # `steps.sweep.conclusion` rather than the job's `failure()`, and that is the
      # difference between a signal and a thing people mute: over the sampled runs
      # `failure()` alone fires 18 times and this fires none. The margin is in the
      # rulebook bullet with the sample that produced it; what belongs here is that
      # the discriminator is the STEP. `failure()` itself is NOT redundant and must
      # not be removed — it is the status function that lets the step run at all
      # after a failed one.
      #
      # `refs/heads/master` because `on: push` also carries `fix-ci`, which exists
      # for deliberately breaking CI, and the release tags, where `--all` running
      # green is not news.
      #
      # One OPEN issue, updated by comment rather than replaced — a fresh issue per
      # push is the same noise problem in another medium. The lookup is
      # `--state open`, so this is deliberately not "reopened": a report somebody
      # closed is not found, and the next failure opens a fresh one. That is the
      # wanted behaviour — a closed report means the finding was dealt with, and a
      # later failure is later news — but it is the opposite of what the word
      # "reopen" would promise, and commenting on a closed issue does not reopen it
      # anyway. Found by its TITLE, which
      # both the lookup and the create read out of the step's own `TITLE` env var,
      # so they cannot drift apart without one edit changing both. Not by a label
      # of its own:
      # `CONTRIBUTING.md` enumerates the label prefixes this repository uses and
      # there is no room in it for a private one, so a `ci/…` key would be a label
      # every documented filter is blind to.
      #
      # `status/needs-triage` is applied HERE rather than left to
      # `issue-triage.yml`, which cannot see this issue at all: an issue opened
      # with `GITHUB_TOKEN` triggers no workflow, so the repository's one
      # reader-attachment mechanism does not fire and the report would land
      # outside every triage query — a reader put on it in name only.
      - name: "Report a full sweep that only master saw"
        if: ${{ failure() && steps.sweep.conclusion == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Stated rather than inferred from the checkout's remote, which is how
          # `issue-triage.yml` does it and is one `working-directory` away from
          # resolving to nothing.
          GH_REPO: ${{ github.repository }}
          TITLE: "clang-tidy: the full sweep on master is failing"
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The full \`clang-tidy\` sweep failed on the master push for \`${GITHUB_SHA}\`.

          ${run_url}

          The merge queue diff-scopes this sweep, so the master push is the only
          place a finding outside a change's include closure is seen — which is
          almost always the analyser drifting rather than any one change. Nothing
          is blocked by this, and the next pull request whose change escalates to a
          full sweep will fail for a reason that has nothing to do with it."
          # NOT `--search`, and that is the whole reason this lists and matches by
          # title rather than searching for the title. `--search` goes through
          # GitHub's issue search INDEX, which lags creation by seconds to minutes
          # — so two master pushes failing inside that window would each find
          # nothing and each open an issue, which is the noise this step exists to
          # avoid. A plain `gh issue list` reads the repository's issue connection
          # directly rather than the index, so the second push sees what the first
          # just opened.
          #
          # That connection is GRAPHQL — `gh issue list` is not a REST call, which
          # this comment claimed until the error message said otherwise. It does
          # not change the consistency argument, which is about the index and not
          # about the transport, but it is a different rate-limit budget from the
          # `gh api` calls elsewhere in this repository and a reader chasing a
          # failure here should know which one it spends.
          #
          # It lists every OPEN issue and is deliberately NOT narrowed by the
          # labels this step applies. Narrowing by them was the first shape and it
          # made the dedup depend on labels nobody promised to keep — this step
          # invites a human to touch them by applying `status/needs-triage`, and a
          # triager re-areaing the report (clang-tidy drift is arguably not
          # `area/build`) would make the next failure miss the open issue and open
          # a second one. The exact title decides it; the labels are for the
          # humans. 161 open issues today against a 500 cap, and when the listing
          # comes back AT the cap it says so rather than silently vouching for a
          # set it did not see.
          #
          # `$ENV.TITLE` rather than the title spliced into the jq program, so no
          # quoting in a title anyone rewords later can turn the lookup into a
          # syntax error and every later failure into a second issue.
          limit=500
          found="$(gh issue list --state open --limit "$limit" --json number,title \
                   --jq '(length | tostring) + "\t"
                         + ([.[] | select(.title == $ENV.TITLE) | .number] | first // "" | tostring)')"
          seen="${found%%$'\t'*}"
          existing="${found#*$'\t'}"
          if [[ "$seen" -ge "$limit" ]]; then
            echo "::warning::the open-issue listing hit its ${limit} cap; a duplicate report may be opened"
          fi
          if [[ -n "$existing" ]]; then
            echo "updating existing report #${existing} (searched ${seen} open issues)"
            gh issue comment "$existing" --body "$body"
          else
            echo "opening a new report (searched ${seen} open issues, no title match)"
            gh issue create --title "$TITLE" --body "$body" \
              --label type/bug --label area/build --label status/needs-triage
          fi

  # The other half of what used to be the clang-tidy job. The ctest run here is
  # load-bearing and is the reason this job exists rather than the tidy job
  # simply losing its build: the `clang-debug` preset is the only configuration
  # in this workflow with ASan and UBSan on, so this is the project's entire
  # sanitizer coverage. It moved; it did not go.
  #
  # It keeps the `clang-debug` preset rather than switching to `clang-asan-ubsan`
  # (which the job is NAMED after) because that preset does not set
  # PEDANTIC_COMPILER_WERROR, and trading the sanitizer job's warnings-as-errors
  # for a tidier preset name is not a trade. `-DENABLE_TIDY=OFF` is the only
  # difference from what this job used to be.
  clang-asan-ubsan:
    name: "clang-asan-ubsan"
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-clang-debug-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-clang-debug-

      # 1G, not the 256M every other job uses, and the difference is measured
      # rather than guessed: on run 33243524509 this configuration ended at
      # 99.76% of a 256M cache having run **44 cleanups**, so it was evicting its
      # own objects inside a single build. A Debug build with ASan and UBSan
      # produces far larger objects than the Release jobs, which finished at
      # 69.7% full with zero cleanups and are therefore left alone. 1G rather
      # than 2G because the whole repository shares a 10 GB Actions cache budget
      # with the CPM and sccache entries, and `Cleanups` in the step below is
      # what says whether it is enough.
      #
      # `save` only on a push, and that is what makes 1G affordable. The action
      # appends a timestamp to the key, so every run writes a NEW entry rather
      # than updating one — at 1G that is a gigabyte of the repository's shared
      # 10 GB Actions budget per run, competing with the Windows sccache entries
      # this workflow now also fills. A pull-request run's entry is scoped to its
      # own ref and can never be read by master or by another pull request, so it
      # only ever helps a repeat push to the same branch; restoring from master's
      # entry, which is what actually gives the 90% hit rate, still works.
      - name: "ccache"
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-clang-debug
          max-size: 1G
          save: ${{ github.event_name == 'push' }}

      - name: "Install build tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libyaml-cpp-dev libssl-dev openssl

      - name: "Install Clang ${{ env.CLANG_TOOLS_VERSION }}"
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.CLANG_TOOLS_VERSION }}
          sudo apt-get install -y clang-${{ env.CLANG_TOOLS_VERSION }} libc++-${{ env.CLANG_TOOLS_VERSION }}-dev libc++abi-${{ env.CLANG_TOOLS_VERSION }}-dev
          sudo ln -sf /usr/bin/clang-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang++

      # CMAKE_CXX_SCAN_FOR_MODULES=OFF for the same reason the tidy job names it,
      # and here it is insurance rather than necessity: CompileCache.cmake turns
      # the scan off only inside the branch that picks a launcher, so a ccache
      # this job fails to find silently buys a clang-scan-deps process per
      # translation unit across ~590 units. This project has no module units.
      - name: "Configure"
        run: >-
          cmake --preset clang-debug -DENABLE_TIDY=OFF
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DFASTCACHED_ENABLE_TLS=ON
          -DFASTCACHED_BUILD_BENCHMARKS=ON -DFASTCACHED_BUILD_TESTCLIENT=ON

      - name: "Build"
        run: cmake --build --preset clang-debug

      # The ccache-action prints its own statistics, but in a post step at the
      # very bottom of a collapsed log, an hour of scrollback away from the build
      # they describe. `Cleanups` is the number that decides `max-size` above, so
      # it is printed here, next to the build it belongs to.
      - name: "Report ccache effectiveness"
        run: ccache --show-stats --verbose

      - name: "Test"
        run: ctest --preset clang-debug

  # ThreadSanitizer, over the concurrency-bearing tests only.
  #
  # The `clang-tsan` preset existed for a long time and nothing invoked it. The
  # first time anyone ran it by hand it found a real race in `AdminEndpoint`
  # (#260) — which is the argument for this job, and also why the job is not
  # simply "run everything under TSan".
  #
  # SCOPE, and what it is not. `Async`, `Consensus`, `Distributed` and the node
  # are where most of the threads are — but not all of them, and the gap has a
  # sharp edge: `Net/` and `Cache/` spawn threads too, and the one race this job
  # suppresses (#260) is a `Net/` class. So this gate currently suppresses a known
  # race in a module it does not scan, reaching it only because the node binary is
  # run whole — issue #316. This is a first scope, not a complete one, and saying
  # otherwise is how a job goes green over code nobody sanitized. Those four map
  # onto five Catch2 tags —
  # `[async]`, `[consensus]`, `[distributed]`, `[reactor]`, `[task]` — plus one
  # binary run whole. The tags are not claimed to be confined to those three
  # directories: three test files elsewhere carry one and are swept in, which is
  # harmless, because running MORE than the scope is not the failure this guards.
  # Running LESS is, and the first version of that list ran less — it named three
  # tags and silently excluded six of ten `Async/` test files while every signal
  # in the run said clean.
  #
  # So the scope is enforced rather than asserted: `ctest -R tsan-scope-hygiene`
  # runs in the DEFAULT set and fails when a test file in one of those
  # directories carries no selected tag. Widening the scope is therefore two
  # edits that check each other — the `TARGETS` table in `scripts/tsan-gate.sh`
  # and `FastCachedTsanScopeTags` in `scripts/check-tsan-scope.cmake`.
  #
  # WHY A SCRIPT AND NOT `ctest`. Because a clean sanitizer run is not evidence.
  # `cmake/portable/Sanitizers.cmake` records a defect on this repository where
  # the option read ON, the configure log printed "Enabling", and no
  # `-fsanitize=` reached the compile line at all — so the sanitizer presets had
  # never once run a sanitizer, and every signal an author would check said yes.
  # `scripts/tsan-gate.sh` refuses to report clean until it has proved both that
  # the test binaries carry `__tsan_init` and that a deliberately racy canary
  # still goes red. `ctest` cannot tell "no races" from "no sanitizer"; this can.
  #
  # It is a full job because TSan needs its own build of the tree. The tests
  # themselves are cheap — measured at 1.2s and 17.6s — so this job is its build,
  # and it is on every push for the same reason the ASan job is: a race found a
  # week later has a week of commits to bisect through.
  clang-tsan:
    name: "clang-tsan"
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # The gate bounds each test binary itself, which names the target that stalled;
    # this bounds the build as well, so a hang anywhere in the job stops in an hour
    # rather than at GitHub's six-hour default. Every wait is bounded.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same key as clang-tidy and clang-asan-ubsan, for the reason the first of
      # them states: this cache holds SOURCE, which is identical whatever sanitizer
      # the build then applies. A third entry would spend the repository's shared
      # 10 GB budget again and make this job's first run a cold download of every
      # CPM package.
      #
      # `cache/restore` and not `cache`, which is the difference from those two:
      # they already both WRITE this key, so on a CMakeLists.txt change each
      # uploads the same archive and the losers discard theirs after paying for
      # it. A third writer makes that worse and buys nothing — the entry is
      # identical whoever saves it, so this job reads and lets clang-tidy save.
      # The pre-existing two-writer case is issue #318.
      - name: "Cache CPM packages"
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-clang-debug-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-clang-debug-

      # A ccache key of its own, deliberately: `-fsanitize=thread` and
      # `-fsanitize=address,undefined` give every translation unit a different
      # compiler command line, so sharing clang-debug's key would produce no
      # cross-job hits at all while forcing two working sets into one cap. That is
      # thrashing, not sharing.
      #
      # 512M rather than the 1G clang-asan-ubsan measured for itself, and the
      # number comes from a measurement rather than from the target list looking
      # smaller: one clean build of exactly these three targets produces 439
      # object files totalling 417 MB uncompressed, which ccache stores
      # compressed. The rule for this knob is that a cap is judged by `Cleanups`
      # rather than copied from a neighbour — raising a cap that is not full
      # spends a shared budget on nothing, and that budget also carries the
      # Windows sccache entries. The `--show-stats` step below is what says
      # whether 512M is enough; raise it when `Cleanups` is non-zero, not before.
      # `save` only on a push, so pull-request runs read master's entry without
      # each writing their own.
      - name: "ccache"
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-clang-tsan
          max-size: 512M
          save: ${{ github.event_name == 'push' }}

      - name: "Install build tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libyaml-cpp-dev libssl-dev openssl

      - name: "Install Clang ${{ env.CLANG_TOOLS_VERSION }}"
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.CLANG_TOOLS_VERSION }}
          sudo apt-get install -y clang-${{ env.CLANG_TOOLS_VERSION }} libc++-${{ env.CLANG_TOOLS_VERSION }}-dev libc++abi-${{ env.CLANG_TOOLS_VERSION }}-dev
          sudo ln -sf /usr/bin/clang-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang++
          # This job's green depends on a suppression MATCHING, and `race_top:`
          # matches a function name — which needs symbolization. Without a pinned
          # llvm-symbolizer the runtime falls back to whatever the image happens
          # to carry, and a #260 report that fails to symbolize arrives as a NEW
          # unsuppressed race, sending the reader to file an issue that exists.
          #
          # `test -x` before the link, and that is the point rather than caution:
          # `ln -sf` onto a missing target succeeds and leaves a DANGLING link,
          # which is worse than no link at all — the runtime then execs something
          # that is not there. Fail here, where the message is the package name.
          sudo apt-get install -y llvm-${{ env.CLANG_TOOLS_VERSION }}
          test -x /usr/bin/llvm-symbolizer-${{ env.CLANG_TOOLS_VERSION }}
          sudo ln -sf /usr/bin/llvm-symbolizer-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/llvm-symbolizer

      - name: "Configure"
        run: >-
          cmake --preset clang-tsan
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DFASTCACHED_ENABLE_TLS=ON

      # Only the targets the gate runs — but do not read that as "the scope makes
      # this job cheap". `FastCacheTest` is one binary carrying every library
      # `*_test.cpp`, so these three targets are 439 of the 552 configured compile
      # edges: ~79% of a full Debug build. The tag scope buys RUNTIME (18.8s
      # against minutes of per-process sanitized startup) and almost nothing at
      # build time. This job's cost is its compile, and naming the four targets it
      # does skip — daemon, launcher, benchmarks, testclient — is worth about 50
      # translation units.
      - name: "Build"
        run: >-
          cmake --build --preset clang-tsan --target
          FastCacheTest fastcache-compile-node-tests tsan-canary

      - name: "Report ccache effectiveness"
        run: ccache --show-stats --verbose

      # Every refusal has a message of its own, because each is fixed somewhere
      # different, and each was verified by making it happen. The list is in the
      # header of `scripts/tsan-gate.sh` and deliberately only there — an earlier
      # version of this comment enumerated "five", in a different order from the
      # two other places that also enumerated them, having dropped the two
      # refusals that are hardest to reason about.
      - name: "ThreadSanitizer gate"
        run: scripts/tsan-gate.sh out/build/clang-tsan

  # Coverage, measured once, on Linux, with Clang. One configuration and not a
  # matrix, because coverage answers "which lines did the tests reach", and that
  # does not vary by compiler or platform — where they genuinely differ is
  # whether the code builds and passes at all, which is what the `linux`,
  # `macos` and `windows` jobs above and below are for. A second instrumented
  # build would double the cost to re-answer a question already answered.
  #
  # This job does not gate on a percentage and must not be given one. Its whole
  # purpose right now is to establish a baseline and publish it; the long-term
  # target is >90%, and getting there is separate work on separate pull
  # requests. A threshold added here would block merges on a number nobody has
  # had a chance to move yet — see issue #149.
  coverage:
    name: "Code coverage"
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Read here rather than in each step's `if`, because the `secrets` context is
    # not available in a step-level condition while `env` is. Empty on a pull
    # request from a fork, where GitHub withholds secrets — which is exactly the
    # behaviour wanted: the upload is skipped and the job still passes.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # Where scripts/coverage.sh leaves everything the steps below publish.
      # Spelled once: three steps read out of it, and a preset rename that moved
      # the directory would otherwise leave two of them silently finding nothing.
      COVERAGE_DIR: out/build/clang-coverage/coverage
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-clang-coverage-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-clang-coverage-

      # No ccache step here, unlike the two jobs above, and that is not an
      # oversight to correct. The clang-coverage preset sets
      # USE_COMPILER_CACHE=OFF and cmake/Coverage.cmake refuses to configure at
      # all if a compiler-cache launcher is set, because coverage mapping data
      # is embedded in the object file and names its sources by absolute path —
      # a replayed object describes the tree it was built in. So a cache step
      # could never front this compile; it would only write an entry nothing
      # reads, against the repository's Actions cache quota.

      - name: "Install build tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libyaml-cpp-dev libssl-dev openssl

      # llvm-${CLANG_TOOLS_VERSION} on top of clang, and the version has to be
      # the same one: llvm-profdata and llvm-cov live in that package, and the
      # raw profile format is versioned, so a mismatched pair rejects the file.
      # cmake/Coverage.cmake refuses to configure rather than let that surface
      # later as a complaint about the profile.
      - name: "Install Clang ${{ env.CLANG_TOOLS_VERSION }} and its LLVM tools"
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.CLANG_TOOLS_VERSION }}
          sudo apt-get install -y clang-${{ env.CLANG_TOOLS_VERSION }} llvm-${{ env.CLANG_TOOLS_VERSION }} libc++-${{ env.CLANG_TOOLS_VERSION }}-dev libc++abi-${{ env.CLANG_TOOLS_VERSION }}-dev
          sudo ln -sf /usr/bin/clang-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-${{ env.CLANG_TOOLS_VERSION }} /usr/local/bin/clang++

      # TLS on, to match the surface the `linux` job tests. Benchmarks and the
      # test client deliberately off, unlike that job: it builds them so they
      # cannot rot, but no ctest test runs either binary, so instrumenting them
      # would report 0% for code the suite was never meant to reach and pull the
      # figure down while looking like rigour.
      - name: "Configure"
        run: cmake --preset clang-coverage -DFASTCACHED_ENABLE_TLS=ON

      - name: "Build"
        run: cmake --build --preset clang-coverage

      # Runs the whole suite under instrumentation and renders the report — the
      # same target, and the same scripts/coverage.sh, a developer runs locally.
      # A failing test fails this step: the script renders the report anyway, to
      # read while debugging, and then re-raises, so the steps that publish a
      # number never run for a red build.
      - name: "Measure coverage"
        run: cmake --build --preset clang-coverage --target coverage

      # always(), so a red suite still says what it measured — the report is
      # rendered either way, and the figure is the first thing anyone asks for.
      # Guarded on the file existing because a build that never linked has no
      # report at all.
      - name: "Summarize"
        if: always()
        run: |
          report="$COVERAGE_DIR"
          if [[ ! -f "$report/percent.txt" ]]; then
            echo "No coverage report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Code coverage"
            echo
            echo "**$(cat "$report/percent.txt")%** of lines covered."
            # Tested separately from percent.txt rather than assumed from it:
            # the script writes this one later, so a failure in between would
            # otherwise render a percentage above an empty code fence.
            if [[ -f "$report/report.txt" ]]; then
              echo
              echo '```'
              # The header row and the totals row: region, function, line and
              # branch figures with their column names, rather than a blind tail
              # that picks up whichever file llvm-cov happened to print last.
              grep -E '^(Filename|TOTAL)' "$report/report.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload the HTML report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: ${{ env.COVERAGE_DIR }}/html
          retention-days: 7
          if-no-files-found: warn

      # Skipped, and the job still green, until a maintainer enables the
      # repository at codecov.io and adds CODECOV_TOKEN — so this lands working
      # rather than red. Deliberately NOT `if: always()`: a red suite must not
      # publish a number.
      - name: "Upload to Codecov"
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ${{ env.COVERAGE_DIR }}/coverage.lcov
          # The lcov export already carries only first-party non-test sources,
          # so there is nothing else in the directory worth finding.
          disable_search: true
          # False, and deliberately. This job is a row in release.needs, so a
          # Codecov outage or rate-limit with fail_ci_if_error would fail a tag
          # build whose every other job was green and leave no draft release —
          # a third party's availability deciding whether this project can ship.
          # The measurement is what gates; publishing it is not.
          fail_ci_if_error: false

  macos:
    name: "macOS-clang-release"
    runs-on: macos-14
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-clang-release-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-clang-release-

      - name: "ccache"
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-clang-release
          max-size: 256M

      # Apple's bundled AppleClang 15 ships a libc++ without std::jthread
      # (libc++ only implemented it in LLVM 18). Use Homebrew's LLVM, whose
      # modern libc++ has it. llvm is keg-only, so we point the compiler at its
      # explicit path and add its libc++ to the linker search + rpath.
      - name: "Install build tools"
        run: brew install ninja llvm openssl@3

      # The clang-release preset pins CMAKE_C/CXX_COMPILER to bare clang/clang++
      # (= AppleClang on PATH); override on the command line, which takes
      # precedence over preset cache variables, to use Homebrew's LLVM instead.
      #
      # Homebrew's libc++.dylib has `@rpath/libc++abi.1.dylib` and
      # `@rpath/libunwind.1.dylib` as runtime deps; libunwind lives under
      # `lib/unwind/`, not `lib/c++/`. Without that second rpath, dyld
      # resolves libunwind from /usr/lib/system instead — the resulting
      # two-libunwind / two-libc++abi load corrupts exception unwinding
      # on macos-14 and Catch2 sees SIGABRT instead of the C++ throw.
      # OpenSSL is keg-only on Homebrew, so point CMake at it via OPENSSL_ROOT_DIR.
      - name: "Configure"
        run: |
          cmake --preset clang-release \
            -DFASTCACHED_ENABLE_TLS=ON \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DCMAKE_C_COMPILER=/opt/homebrew/opt/llvm/bin/clang \
            -DCMAKE_CXX_COMPILER=/opt/homebrew/opt/llvm/bin/clang++ \
            -DCMAKE_EXE_LINKER_FLAGS="-L/opt/homebrew/opt/llvm/lib/c++ -L/opt/homebrew/opt/llvm/lib/unwind -L/opt/homebrew/opt/llvm/lib -lunwind -Wl,-rpath,/opt/homebrew/opt/llvm/lib/c++ -Wl,-rpath,/opt/homebrew/opt/llvm/lib/unwind"

      - name: "Build"
        run: cmake --build --preset clang-release

      - name: "Test"
        run: ctest --preset clang-release

  # Builds the container image (which compiles with TLS on against the system
  # OpenSSL) and smoke-tests it: start the container, hit /healthz from the host,
  # and run the in-image `--healthcheck`. This is the authoritative check that
  # the Dockerfile builds and the health probe works end-to-end in the image.
  docker:
    name: "Docker image"
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Build image"
        run: docker build -t fastcached:ci .

      - name: "Smoke test the image"
        run: |
          docker run -d --name fc -p 6674:6674 -p 9259:9259 fastcached:ci \
            --bind=0.0.0.0 --metrics --metrics-bind=0.0.0.0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9259/healthz >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:9259/healthz
          curl -fsS http://127.0.0.1:9259/metrics | grep -q fastcached_cmd_get_total
          docker exec fc fastcached --healthcheck
          docker rm -f fc

  # Smoke tests live in sibling jobs so the PR status check tells you *which*
  # client or protocol broke without opening the log. They share the same
  # fastcached binary artifact and the same compile-twice / expect-cache-hit
  # assertion, and cover one supported compile-cache client each: sccache over
  # the three wire protocols it can reach us on, and our own fastcache-cc over
  # the compile-cache 0xFC protocol.
  #
  # Between the three sccache jobs the only deltas are which sccache version is
  # installed (apt = 0.7.7 = OpenDAL 0.44 = memcached TEXT wire;
  # mozilla-actions's prebuilt = >=0.8 = OpenDAL >=0.45 = memcached BINARY wire)
  # and which SCCACHE_* env var points sccache at fastcached.

  sccache-smoke-memcached-text:
    name: "sccache smoke (memcached text)"
    runs-on: ubuntu-24.04
    needs: [changes, linux]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Download fastcached binary"
        uses: actions/download-artifact@v4
        with:
          name: fastcached-linux
          path: bin
      - name: "Make fastcached executable"
        run: chmod +x bin/fastcached
      - name: "Install sccache + a C++ compiler"
        run: |
          sudo apt-get update
          sudo apt-get install -y sccache g++-14
      - name: "Smoke"
        run: bash scripts/sccache-smoke.sh --fastcached ./bin/fastcached --protocol memcached --port 11611 --compiler g++-14

  sccache-smoke-memcached-binary:
    name: "sccache smoke (memcached binary)"
    runs-on: ubuntu-24.04
    needs: [changes, linux]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Download fastcached binary"
        uses: actions/download-artifact@v4
        with:
          name: fastcached-linux
          path: bin
      - name: "Make fastcached executable"
        run: chmod +x bin/fastcached
      - name: "Install C++ compiler + libyaml-cpp runtime"
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libyaml-cpp0.8
      # mozilla-actions/sccache-action ships sccache >= 0.8, which uses
      # OpenDAL >= 0.45 and speaks the memcached BINARY protocol; the apt
      # sccache (0.7.7) on noble still speaks text.
      #
      # v0.0.6 while the Windows jobs are on v0.0.11, deliberately: this job uses
      # the action purely to put an sccache BINARY on PATH and then points it at a
      # fastcached daemon. It never touches the Actions-cache backend, which is
      # the only thing the newer version is needed for.
      - name: "Install sccache (binary protocol via OpenDAL >= 0.45)"
        uses: mozilla-actions/sccache-action@v0.0.6
      - name: "Smoke"
        run: bash scripts/sccache-smoke.sh --fastcached ./bin/fastcached --protocol memcached --port 11611 --compiler g++-14

  sccache-smoke-redis:
    name: "sccache smoke (redis RESP2)"
    runs-on: ubuntu-24.04
    needs: [changes, linux]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Download fastcached binary"
        uses: actions/download-artifact@v4
        with:
          name: fastcached-linux
          path: bin
      - name: "Make fastcached executable"
        run: chmod +x bin/fastcached
      - name: "Install sccache + a C++ compiler"
        run: |
          sudo apt-get update
          sudo apt-get install -y sccache g++-14
      - name: "Smoke"
        run: bash scripts/sccache-smoke.sh --fastcached ./bin/fastcached --protocol redis --port 11611 --compiler g++-14

  # The fourth client: our own launcher over the compile-cache 0xFC protocol.
  # It runs the same harness the E2E jobs do rather than a cut-down copy of its
  # assertions, but points it at the *uploaded release binaries* instead of a
  # freshly built tree — so this job answers "do the artifacts we ship
  # interoperate", the same question the sccache smoke jobs answer for the
  # daemon, while the E2E jobs answer "does the contract hold for each compiler
  # driver on each platform".
  fastcache-cc-smoke:
    name: "fastcache-cc smoke (compile-cache 0xFC)"
    runs-on: ubuntu-24.04
    needs: [changes, linux]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Download the fastcached + fastcache-cc binaries"
        uses: actions/download-artifact@v4
        with:
          name: fastcached-linux
          path: bin
      - name: "Make the binaries executable"
        run: chmod +x bin/fastcached bin/fastcache-cc
      - name: "Install a C++ compiler + libyaml-cpp runtime"
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libyaml-cpp0.8
      # Exit 77 means a prerequisite was missing and nothing was verified, which
      # must fail here rather than report green.
      - name: "Smoke"
        run: |
          bash scripts/compile-cache-e2e.sh \
            --fastcached ./bin/fastcached \
            --launcher ./bin/fastcache-cc \
            --compiler g++-14 \
            --port 11611 || { c=$?; [ "$c" = 77 ] && echo "::error::smoke skipped, nothing verified"; exit "$c"; }

  windows:
    name: "Windows-${{ matrix.preset }}"
    runs-on: windows-2025
    needs: changes
    # A job-level condition on a MATRIX job is the shape #300 warns about, and
    # this is the one form of it that is safe: `!cancelled()` is false only while
    # the RUN is being cancelled, so the matrix always expands and every leg
    # reports under its real name. It is here so that a FAILED `changes` cannot
    # skip this job -- which, being a matrix, would take its per-leg required
    # contexts out of existence entirely. The step conditions below still decide
    # whether any work happens.
    if: ${{ !cancelled() }}
    # The Windows jobs were the second-biggest block in this workflow — 21.2 and
    # 15.7 minutes, of which 17.2 and 11.8 were the build — and they were paying
    # a full cold compile every single run. Measured on run 33243524509: sccache
    # reported `Cache location  Local disk`, on an ephemeral runner. Nothing it
    # stored ever survived the job that stored it, so the cache was installed,
    # announced by the configure, genuinely used — and could not possibly hit. The
    # E2E job's own statistics are the receipt: 231 compile requests, 2 hits.
    #
    # Those two figures are history, not the current cost: what these jobs take
    # now, what fraction of it is `ctest` rather than the build, and what the hit
    # rate actually is are one table in `.agent/rules/build-and-toolchain.md`.
    #
    # The action does not set this itself — its README tells you to — and without
    # it sccache never looks at the Actions cache at all. Set at job level rather
    # than per step because it has to be visible to the configure (which picks
    # the launcher) and to the build (which runs it).
    #
    # Safe against the MSVC `/showIncludes` hazard that CompileCache.cmake warns
    # about, and the reason is worth writing down rather than re-deriving: that
    # hazard needs an INCREMENTAL build across checkouts at DIFFERENT absolute
    # paths. Every runner builds from scratch at `D:\a\fastcached\fastcached`, so
    # neither half holds, and sharing entries between runs is sharing them
    # between builds that spell every path identically.
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        # cl-debug is the third leg and it is here for the RUNTIME, not the
        # compiler: MSVC's Debug CRT sets `_ITERATOR_DEBUG_LEVEL=2`, which traps
        # invalidated iterators, out-of-range indexing and mismatched container
        # iterators at the point they happen. That was the one configuration on
        # Windows nobody ran, while being the default Windows preset every
        # developer here debugs with — so a `cl-debug`-only defect could live on
        # master indefinitely with every status check green (#315).
        #
        # A third leg rather than replacing a Release one, and that is measured
        # rather than assumed. No Windows leg was the longest job in any of the 13
        # code-touching pull-request runs sampled for the per-event table in
        # `.agent/rules/build-and-toolchain.md` — that is `Code coverage` or an
        # escalated `clang-tidy` sweep — so this leg costs runner-minutes and no
        # wall clock at all, which is cheaper than giving up a Release
        # configuration to buy it.
        #
        # The per-leg figures live in that table and are deliberately not restated
        # here. The pre-`SCCACHE_GHA_ENABLED` numbers in the comment above were
        # copied into this spot once already, and by the time anyone re-measured
        # they described a two-leg matrix that no longer existed while reading
        # like current fact. Which job "finishes last" is likewise a property of
        # the EVENT, not of this workflow: it is `clang-tidy` on master and inside
        # the queue, where every sweep is a full one, and on a pull request it is
        # `Code coverage` in most runs and an escalated `clang-tidy` sweep in the
        # rest — 9 and 4 of the 13 sampled. Not one of them is a Windows leg,
        # which is the only part of it this comment depends on.
        #
        # It runs `ctest` like its siblings, because a Debug leg that only
        # compiles exercises none of the runtime it was added for. The
        # `iterator-debug-canary` test is what refuses to believe it did.
        preset: [cl-release, clangcl-release, cl-debug]
    steps:
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.code != 'false' }}
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        if: ${{ needs.changes.outputs.code != 'false' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-${{ matrix.preset }}-

      # v0.0.11 rather than v0.0.6: GitHub's cache service v1 is gone, and only
      # the newer action exports the ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN
      # pair that sccache's GHA backend reads. An older action with
      # SCCACHE_GHA_ENABLED set is the failure this whole block exists to stop —
      # a cache that is configured, announced, and inert.
      - name: "sccache"
        if: ${{ needs.changes.outputs.code != 'false' }}
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: "Install ninja"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: choco install ninja --no-progress

      # Pin the MSVC toolset to 14.44. The windows-2025 image moved to VS 18 /
      # MSVC STL 14.51, whose <xutility> trips a "static assertion failed:
      # unexpected size" under the runner's bundled clang-cl 20.1.8 (the cl
      # job is unaffected — MSVC compiles its own STL). 14.44 is the last
      # toolset clang-cl 20.1.8 accepts and the version CI was green on before
      # the image bump; cl-release builds against it equally well.
      - name: "Setup MSVC dev environment"
        if: ${{ needs.changes.outputs.code != 'false' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: "14.44"

      # TLS on, against the OpenSSL preinstalled on the GitHub Windows runner
      # (vcpkg is the local-dev path; CI uses the runner's OpenSSL to avoid a
      # from-source build). Quoted because the path contains a space.
      - name: "Configure"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: >
          cmake --preset ${{ matrix.preset }}
          -DFASTCACHED_ENABLE_TLS=ON
          "-DOPENSSL_ROOT_DIR=C:/Program Files/OpenSSL"

      - name: "Build"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: cmake --build --preset ${{ matrix.preset }}

      # A compiler cache that handled nothing is worse than one that is off,
      # because it reads like success: the configure says "Enabling sccache", the
      # build is green, and the seventeen minutes look like the cost of compiling
      # this project on Windows. So both facts are asserted, not printed.
      #
      # `cache_location` is the one that matters, and asserting only
      # `compile_requests` would have missed the entire regression: the broken
      # configuration reported 231 requests and 2 hits, into a directory the
      # runner deletes. A hit-rate floor is not usable — the first run after a
      # cache key changes is legitimately cold — so what is checked is that the
      # backend is not the ephemeral one, which is a fact about configuration and
      # is true from the very first run. Stated as "not `Local disk`" rather than
      # as "is the Actions cache": `Local disk` is the exact string sccache fell
      # back to and the exact string this job must never see again, while what
      # the GHA backend calls itself is sccache's to rename.
      #
      # And because it is sccache's to rename, the two fields are checked to be
      # PRESENT first. A `-match` against `$null` is `$false`, so an sccache that
      # moves or renames `cache_location` would leave this step green while
      # asserting nothing — the same "configured, announced, inert" shape the step
      # exists to catch, one level up.
      #
      # Here, and NOT in the action's own post step, because sccache keeps its
      # counters in the server and this suite restarts that server: the
      # `sccache-smoke-*` tests point sccache at a fastcached daemon through
      # SCCACHE_MEMCACHED, which zeroes them. That is why the post step reported
      # `Compile requests 0` on run 33243524509 for a build sccache had in fact
      # handled — the E2E job, which runs no ctest, reported 231 requests from the
      # same configuration. A number read after `Test` is somebody else's.
      - name: "Assert sccache actually handled the build"
        if: ${{ needs.changes.outputs.code != 'false' }}
        shell: pwsh
        run: |
          & $env:SCCACHE_PATH --show-stats
          $stats = & $env:SCCACHE_PATH --show-stats --stats-format=json | ConvertFrom-Json
          if ($null -eq $stats.stats.compile_requests -or $null -eq $stats.cache_location) {
            Write-Host "::error::sccache reported no compile_requests/cache_location field; the assertion below cannot run and a null never matches, so this is a refusal rather than a pass"
            exit 1
          }
          if ($stats.stats.compile_requests -eq 0) {
            Write-Host "::error::sccache handled 0 compile requests; the launcher is not wired in"
            exit 1
          }
          if ($stats.cache_location -match 'Local disk') {
            Write-Host "::error::sccache is caching into '$($stats.cache_location)', which is deleted with this runner; SCCACHE_GHA_ENABLED did not take effect"
            exit 1
          }

      - name: "Test"
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: ctest --preset ${{ matrix.preset }}

      - name: "Upload fastcached.exe"
        if: ${{ needs.changes.outputs.code != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: fastcached-windows-${{ matrix.preset }}
          path: out/build/${{ matrix.preset }}/target/fastcached.exe
          if-no-files-found: error

  # End-to-end compile-cache tests. These live in their own jobs, one per
  # platform, so a PR status check names the platform that broke rather than
  # burying it inside a build matrix. Each starts a real fastcached, drives real
  # compiles through fastcache-cc, and asserts the launcher's actual contract:
  # MISS then HIT, the cached object reproduced byte-identically, cross-depth
  # portability (content stored from a deep checkout hits from a shallow one),
  # and a safe fallback when the daemon is unreachable.
  #
  # Cross-depth is the property that distinguishes this launcher from
  # ccache/sccache, and it is only observable end-to-end — a unit test cannot
  # run two checkouts through a real compiler and a real server.

  compile-cache-e2e-linux:
    name: "compile-cache E2E (Linux)"
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-cc-e2e-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-cc-e2e-

      - name: "ccache"
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-cc-e2e
          max-size: 256M

      # clang is installed explicitly rather than relied on: the second E2E step
      # below exits 77 (skip) when its compiler is absent, and a skipped step
      # still reports green — so a missing compiler would silently mean the
      # clang driver was never exercised at all.
      # g++-14 must also be put on PATH as plain `g++`: the gcc-release preset
      # pins CMAKE_CXX_COMPILER to the bare name, which otherwise resolves to
      # the runner's default GCC 13 — and that has no <print>, so main.cpp
      # fails to compile. Same symlink the Linux build matrix installs.
      - name: "Install build tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libyaml-cpp-dev g++-14 clang
          sudo ln -sf /usr/bin/gcc-14 /usr/local/bin/gcc
          sudo ln -sf /usr/bin/g++-14 /usr/local/bin/g++

      - name: "Configure"
        run: cmake --preset gcc-release

      - name: "Build"
        run: cmake --build --preset gcc-release --target fastcached fastcache-cc

      # Run the harness directly rather than through ctest so any failure output
      # lands in this job. Exit 77 means a prerequisite was missing and nothing
      # was actually verified, which must fail here rather than report green.
      - name: "Compile-cache E2E (gcc)"
        run: |
          bash scripts/compile-cache-e2e.sh \
            --fastcached out/build/gcc-release/target/fastcached \
            --launcher out/build/gcc-release/target/fastcache-cc \
            --compiler g++-14 \
            --port 21713 || { c=$?; [ "$c" = 77 ] && echo "::error::E2E skipped, nothing verified"; exit "$c"; }

      # The launcher must work with the clang driver too, not just gcc.
      - name: "Compile-cache E2E (clang)"
        run: |
          bash scripts/compile-cache-e2e.sh \
            --fastcached out/build/gcc-release/target/fastcached \
            --launcher out/build/gcc-release/target/fastcache-cc \
            --compiler clang++ \
            --port 21715 || { c=$?; [ "$c" = 77 ] && echo "::error::E2E skipped, nothing verified"; exit "$c"; }

      # The only shape that catches a WRONG object: build a real target through
      # the launcher and run that target's own tests (#320). The two fixtures
      # above prove the launcher runs and produces AN object; neither runs what
      # came out, which is why #319 -- a cache-backed build that segfaulted while
      # the same commit with -DUSE_COMPILER_CACHE=OFF passed -- could only be
      # found by a developer noticing it.
      #
      # Costs three builds of one test target: a cache-off control, a cold build
      # that stores, and a warm build that replays. Only the warm one is the
      # subject; the other two are what make its green mean something. It runs
      # whenever this job runs, which `ci-scope.sh` already limits to changes that
      # can reach a build -- a docs-only pull request skips the whole job.
      #
      # `--canary` is not optional: it puts a deliberately wrong object into the
      # replayed build and requires the suite to go red. Without it a green run
      # here would be indistinguishable from a fixture that cannot fail.
      - name: "A real target, replayed from cache, passes its own tests"
        run: |
          bash scripts/launcher-replay-e2e.sh \
            --fastcached out/build/gcc-release/target/fastcached \
            --launcher out/build/gcc-release/target/fastcache-cc \
            --compiler g++-14 \
            --target fastcache-cc-tests \
            --canary \
            --port 21717 || { c=$?; [ "$c" = 77 ] && echo "::error::replay E2E skipped, nothing verified"; exit "$c"; }

  compile-cache-e2e-windows:
    name: "compile-cache E2E (Windows)"
    runs-on: windows-2025
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Same backend, same version, same reasons as the `windows` job above, where
    # they are written out. This job builds the same cl-release configuration, so
    # it also hits entries that job stored.
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-cc-e2e-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-cc-e2e-

      - name: "sccache"
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: "Install ninja"
        run: choco install ninja --no-progress

      # Same toolset pin as the windows build matrix; see the comment there.
      - name: "Setup MSVC dev environment"
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: "14.44"

      - name: "Configure"
        run: cmake --preset cl-release

      - name: "Build"
        run: cmake --build --preset cl-release --target fastcached fastcache-cc

      # Same assertion as the `windows` job, where the reasoning is written out.
      # Repeated rather than pointed at, because a cache enabled in three jobs and
      # proved in one is a cache two of them can lose in silence.
      - name: "Assert sccache actually handled the build"
        shell: pwsh
        run: |
          & $env:SCCACHE_PATH --show-stats
          $stats = & $env:SCCACHE_PATH --show-stats --stats-format=json | ConvertFrom-Json
          if ($null -eq $stats.stats.compile_requests -or $null -eq $stats.cache_location) {
            Write-Host "::error::sccache reported no compile_requests/cache_location field; the assertion below cannot run and a null never matches, so this is a refusal rather than a pass"
            exit 1
          }
          if ($stats.stats.compile_requests -eq 0) {
            Write-Host "::error::sccache handled 0 compile requests; the launcher is not wired in"
            exit 1
          }
          if ($stats.cache_location -match 'Local disk') {
            Write-Host "::error::sccache is caching into '$($stats.cache_location)', which is deleted with this runner; SCCACHE_GHA_ENABLED did not take effect"
            exit 1
          }

      # The harness exercises both cl and clang-cl when they are on PATH, and
      # exits 77 if neither is — which must not silently pass, so it is checked.
      - name: "Compile-cache E2E (cl / clang-cl)"
        shell: pwsh
        run: |
          # Do not let a non-zero exit abort the step before the 77 check below:
          # a skip means nothing was verified and must fail rather than pass.
          $ErrorActionPreference = 'Continue'
          & pwsh -NoProfile -File src/apps/fastcache-cc/run-launcher-e2e.ps1 `
            -Fastcached out/build/cl-release/target/fastcached.exe `
            -Launcher out/build/cl-release/target/fastcache-cc.exe `
            -Port 21714
          $code = $LASTEXITCODE
          if ($code -eq 77) {
            Write-Host "::error::E2E skipped, nothing verified"
            exit 1
          }
          exit $code

  # Distribution packages. These jobs assert the properties that unit tests
  # cannot see and that only surface at install time: that the payload lands
  # where systemd and the FHS require, that the shipped config is registered as
  # a config file (so an upgrade never discards a local edit), that the unit
  # actually parses, and that installing the package really does leave a
  # running daemon serving traffic.

  package-linux:
    name: "Package (Linux .deb/.rpm)"
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-package-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-package-

      - name: "ccache"
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-package
          max-size: 256M

      # rpm builds the .rpm on this Debian-family runner; systemd provides
      # systemd-analyze for the unit check below. g++-14 is symlinked as plain
      # `g++` because the gcc-release preset pins the bare name, which would
      # otherwise resolve to the runner's GCC 13 — no <print>, no build.
      - name: "Install build tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libyaml-cpp-dev libssl-dev rpm systemd g++-14
          sudo ln -sf /usr/bin/gcc-14 /usr/local/bin/gcc
          sudo ln -sf /usr/bin/g++-14 /usr/local/bin/g++

      - name: "Configure"
        # FASTCACHED_PACKAGE_ROOT_PREFIX is OFF by default so that a plain
        # `cmake --install --prefix /usr/local` stays conventional; the package
        # layout (payload rooted at /, units under usr/lib/systemd, config in
        # /etc) is opt-in and this is the job that opts in.
        # FASTCACHED_REQUIRE_EXACT_VERSION comes from the workflow-level env: block,
        # which is where the "only on a tag run" reasoning is written down.
        run: cmake --preset gcc-release -DFASTCACHED_BUILD_TESTS=OFF -DFASTCACHED_PACKAGE_ROOT_PREFIX=ON -DFASTCACHED_REQUIRE_EXACT_VERSION=${{ env.FASTCACHED_REQUIRE_EXACT_VERSION }}

      - name: "Build"
        run: cmake --build --preset gcc-release --target fastcached fastcache-cc fastcache-compile-node

      - name: "Package"
        working-directory: out/build/gcc-release
        run: cpack -G "DEB;RPM;TGZ"

      # The units are validated from the source tree (not the installed
      # system) so a typo or a bad directive fails here rather than at first
      # boot on a user's machine.
      - name: "Verify the systemd units parse"
        run: |
          set -euo pipefail
          # systemd-analyze reports problems on stderr but still exits 0 for
          # non-fatal findings, so grep for the ones that matter. The
          # ExecStart-not-executable note is expected: fastcached is not
          # installed at /usr/bin in this step.
          for unit in packaging/linux/fastcached.service packaging/linux/fastcached-user.service; do
            echo "== $unit"
            out=$(systemd-analyze verify "$unit" 2>&1 || true)
            echo "$out"
            if echo "$out" | grep -Ev 'is not executable|Unit .* not found' | grep -qiE 'error|invalid|bad|unknown (lvalue|section)'; then
              echo "::error::$unit failed verification"
              exit 1
            fi
          done

      - name: "Inspect the .deb payload"
        working-directory: out/build/gcc-release
        run: |
          set -euo pipefail
          deb=$(ls fastcached_*.deb)
          echo "== contents"; dpkg -c "$deb"
          echo "== control"; dpkg -I "$deb"

          # Capture the listing once, then assert against the file: re-running
          # the query inside the loop is both slower and needlessly fragile.
          # Field 6 is the path; $NF would be wrong for any symlink entry,
          # which dpkg renders as "path -> target".
          dpkg -c "$deb" | awk '{print $6}' > /tmp/deb-paths.txt

          # The binaries, the units and the config must each land in the one
          # location that works; /usr/etc or /lib would silently never be read.
          for path in ./usr/bin/fastcached ./usr/bin/fastcache-cc ./usr/bin/fastcache-compile-node \
                      ./usr/lib/systemd/system/fastcached.service \
                      ./usr/lib/systemd/user/fastcached.service \
                      ./usr/lib/sysusers.d/fastcached.conf \
                      ./usr/lib/tmpfiles.d/fastcached.conf \
                      ./usr/lib/systemd/system/fastcache-compile-node.service \
                      ./usr/lib/systemd/system/fastcache-compile-node.socket \
                      ./usr/lib/sysusers.d/fastcache-node.conf \
                      ./etc/fastcached/fastcache-compile-node.yaml \
                      ./etc/fastcached/fastcached.yaml; do
            grep -qx "$path" /tmp/deb-paths.txt || { echo "::error::missing $path"; exit 1; }
          done

          # An empty Architecture produces a package dpkg refuses to install.
          dpkg -I "$deb" | grep -qE '^ Architecture: [a-z0-9]+' \
            || { echo "::error::empty Architecture field"; exit 1; }

          # Without the conffiles entry an upgrade silently discards local edits.
          dpkg -e "$deb" /tmp/debcontrol
          # Both, and for the same reason: an upgrade that reset either one is a
          # silent regression. The worker's file is what makes it work at all, so
          # resetting it un-registers the worker with no error anywhere.
          for path in /etc/fastcached/fastcached.yaml /etc/fastcached/fastcache-compile-node.yaml; do
            grep -qx "$path" /tmp/debcontrol/conffiles \
              || { echo "::error::$path not registered as a conffile"; exit 1; }
          done

      - name: "Inspect the .rpm payload"
        working-directory: out/build/gcc-release
        run: |
          set -euo pipefail
          rpmfile=$(ls fastcached-*.rpm)
          echo "== contents"; rpm -qlp "$rpmfile"
          echo "== metadata"; rpm -qip "$rpmfile"

          rpm -qlp "$rpmfile" > /tmp/rpm-paths.txt
          rpm -qcp "$rpmfile" > /tmp/rpm-config.txt

          for path in /usr/bin/fastcached /usr/bin/fastcache-cc /usr/bin/fastcache-compile-node \
                      /usr/lib/systemd/system/fastcached.service \
                      /usr/lib/systemd/user/fastcached.service \
                      /usr/lib/sysusers.d/fastcached.conf \
                      /usr/lib/tmpfiles.d/fastcached.conf \
                      /usr/lib/systemd/system/fastcache-compile-node.service \
                      /usr/lib/systemd/system/fastcache-compile-node.socket \
                      /usr/lib/sysusers.d/fastcache-node.conf \
                      /etc/fastcached/fastcache-compile-node.yaml \
                      /etc/fastcached/fastcached.yaml; do
            grep -qx "$path" /tmp/rpm-paths.txt || { echo "::error::missing $path"; exit 1; }
          done

          # Both, and for the same reason: an upgrade that reset either one is a
          # silent regression. The worker's file is what makes it work at all, so
          # resetting it un-registers the worker with no error anywhere.
          for path in /etc/fastcached/fastcached.yaml /etc/fastcached/fastcache-compile-node.yaml; do
            grep -qx "$path" /tmp/rpm-config.txt \
              || { echo "::error::$path not marked %config"; exit 1; }
          done

      # Install for real and drive traffic through it. The GitHub runner has a
      # live systemd, so this exercises the actual unit — the service account,
      # the hardening, journald capture and the SIGHUP path all included.
      - name: "Install the .deb and exercise the service"
        working-directory: out/build/gcc-release
        run: |
          set -euo pipefail
          sudo apt-get install -y ./$(ls fastcached_*.deb)

          # The postinst enables and starts the unit; it must already be up.
          sudo systemctl is-enabled fastcached
          for _ in $(seq 1 30); do
            systemctl is-active --quiet fastcached && break
            sleep 1
          done
          systemctl is-active --quiet fastcached || {
            echo "::error::service did not start"; sudo journalctl -u fastcached --no-pager; exit 1; }

          # Proves the daemon is NOT daemonizing: journald only sees stderr
          # from a foreground process.
          sudo journalctl -u fastcached --no-pager | tee /tmp/fc-journal.txt
          grep -q 'ready, accepting connections' /tmp/fc-journal.txt \
            || { echo "::error::startup banner missing from the journal"; exit 1; }

          # It must run as the packaged system account, not as root.
          test "$(systemctl show -p User --value fastcached)" = fastcached

          # End-to-end round trip against the packaged default config.
          printf 'set k 0 0 5\r\nhello\r\nget k\r\nquit\r\n' | timeout 10 nc -q1 127.0.0.1 6674 | tee /tmp/fc-proto.txt
          grep -q STORED /tmp/fc-proto.txt
          grep -q hello  /tmp/fc-proto.txt

          # Reload must apply a reloadable setting rather than restart or fail.
          # Assert the edit actually landed: sed exits 0 when it matches
          # nothing, so a reflow of the shipped comment would silently turn this
          # into "reload an unchanged file", which passes without ever
          # exercising the SIGHUP path.
          grep -q '^#log_level: info' /etc/fastcached/fastcached.yaml \
            || { echo "::error::the shipped yaml no longer contains '#log_level: info'; update this step"; exit 1; }
          sudo sed -i 's/^#log_level: info/log_level: debug/' /etc/fastcached/fastcached.yaml
          grep -q '^log_level: debug' /etc/fastcached/fastcached.yaml \
            || { echo "::error::config edit did not apply"; exit 1; }
          sudo systemctl reload fastcached
          sleep 2
          systemctl is-active --quiet fastcached \
            || { echo "::error::service died on reload"; exit 1; }

          # A clean SIGTERM stop: a non-zero exit here would mean the unit
          # restart-loops in production.
          sudo systemctl stop fastcached
          test "$(systemctl show -p Result --value fastcached)" = success

      - name: "Socket-activate the compile worker on real systemd"
        run: |
          set -euo pipefail

          # The account the sysusers.d entry must have created. Without it the
          # unit fails to start with "user does not exist", which says nothing
          # about which package forgot to create it.
          id fastcache-node >/dev/null \
            || { echo "::error::the fastcache-node service account was not created"; exit 1; }

          # A scheduler that is not there. The worker must still start, warn and
          # keep retrying -- a fleet where the scheduler restarts must not turn
          # into a fleet of dead workers.
          # Written as YAML into the file the unit's ExecStart names, which is the
          # ONLY way to configure this worker since #291 -- an env file of
          # command-line arguments and a config file are two mechanisms that can
          # disagree about one setting, and nobody had written down which won.
          printf 'scheduler: 127.0.0.1:6675\nadvertise: 127.0.0.1:6676\ntoolchain:\n  - /usr/bin/g++\n' \
            | sudo tee /etc/fastcached/fastcache-compile-node.yaml >/dev/null

          # Enabling the SOCKET is what enables the worker; the service carries
          # no [Install] on purpose.
          sudo systemctl enable --now fastcache-compile-node.socket
          systemctl is-active --quiet fastcache-compile-node.socket \
            || { echo "::error::the socket unit did not start"; exit 1; }

          # Nothing should be running yet -- that is the whole point of
          # activation. An already-active service here means the socket was
          # bypassed and the unit is just an ordinary daemon.
          systemctl is-active --quiet fastcache-compile-node \
            && { echo "::error::the service started without a connection"; exit 1; }

          # One connection activates it.
          timeout 10 bash -c 'exec 3<>/dev/tcp/127.0.0.1/6676' || true

          # Waited for by its OUTPUT, not by is-active. Type=simple is reported
          # active the moment systemd forks, while this worker still has to walk
          # its toolchain's include tree to compute a fingerprint -- seconds of
          # real work. Polling is-active therefore answers "has it started",
          # which is not the question; the first version of this step asked it
          # and read an empty journal.
          #
          # 240 rather than 90: that walk is thousands of cold stat and read
          # calls, and on a contended runner it outran 90s here while the
          # service sat "active (running)" on 894ms of CPU -- blocked on I/O,
          # not computing. `scripts/fleet-dashboard-e2e.sh` measured the same
          # cost directly and carries the numbers.
          for _ in $(seq 1 240); do
            sudo journalctl -u fastcache-compile-node --no-pager > /tmp/node-log.txt 2>/dev/null || true
            grep -q 'compile node ready' /tmp/node-log.txt && break
            sleep 1
          done
          cat /tmp/node-log.txt
          grep -q 'compile node ready' /tmp/node-log.txt || {
            echo "::error::a connection did not bring the worker up"
            systemctl status fastcache-compile-node --no-pager || true; exit 1; }

          # It must have ADOPTED the socket rather than bound its own, and that is
          # asserted on the STATE as well as on a log line.
          #
          # The paragraph here used to argue the grep was belt-and-braces, because a
          # worker that failed to adopt would collide with the socket unit already
          # holding the port and never come up. That was true while the activated
          # surface was the dedicated compile port -- `--bind`/`--port`, the same port
          # the unit holds. #290 stage 3 activates the NODE surface instead, whose
          # default is 6674 while this unit holds 6676, and `fastcached` is stopped a
          # step earlier so 6674 is free. A non-adopting worker therefore binds its
          # own default, logs readiness, and passes every other assertion in this
          # step. The reasoning survived the change that invalidated it, so the grep
          # had quietly become the only check standing here.
          #
          # `ss` rather than a connect probe: a connect to 6676 succeeds either way,
          # since the socket unit answers it whether or not the service adopted. What
          # separates the two outcomes is whether anything is listening on the port
          # the FALLBACK would take.
          command -v ss >/dev/null \
            || { echo "::error::ss is unavailable, so this step cannot tell an adopted socket from a bound one"; exit 1; }
          # Captured and matched, never `ss ... | grep -q`. That pipeline is a false
          # NEGATIVE under `pipefail`, and it fails on the success path: `grep -q`
          # exits at the first match, `ss` dies of SIGPIPE, and `pipefail` reports
          # the producer's status -- so the pipeline says "nothing listening"
          # precisely when something IS. Same trap as `nm | grep -q __tsan_init` in
          # build-and-toolchain.md, which is where this shape is written down.
          #
          # `if` rather than an `&&` chain for the second reason: under `set -e` the
          # good case would make a chained form return non-zero and abort the step.
          listening_6674="$(ss -lnt 'sport = :6674' 2>/dev/null || true)"
          if [[ "$listening_6674" == *LISTEN* ]]; then
            echo "::error::the worker bound its own --listen-node default instead of adopting the activated socket"
            ss -lnt || true; exit 1
          fi

          # And the sentence, which is what says WHY it is not on 6674 -- the state
          # check alone cannot separate "adopted" from "started no listener at all".
          # Its wording changed with the flags: it named `--bind` and `--port` until
          # stage 3 deleted them.
          grep -q 'serving a socket-activated listener' /tmp/node-log.txt \
            || { echo "::error::the worker did not adopt the activated socket"; exit 1; }

          test "$(systemctl show -p User --value fastcache-compile-node)" = fastcache-node

          # The stop path, on real systemd and on an ADOPTED descriptor. This is
          # the assertion that matters most here: POSIX does not unblock a parked
          # accept() when the listener is closed, so a worker without a receive
          # timeout hangs until systemd escalates to SIGKILL -- and that bug has
          # already shipped once, on the ordinary bind path. `Result=success`
          # distinguishes a clean exit from a killed one; `is-system-running`
          # would not.
          sudo systemctl stop fastcache-compile-node
          test "$(systemctl show -p Result --value fastcache-compile-node)" = success \
            || { echo "::error::the worker did not stop cleanly"
                 sudo journalctl -u fastcache-compile-node --no-pager; exit 1; }
          sudo systemctl stop fastcache-compile-node.socket

      - name: "Verify an upgrade keeps local config edits"
        working-directory: out/build/gcc-release
        run: |
          set -euo pipefail
          echo '# local edit that must survive' | sudo tee -a /etc/fastcached/fastcached.yaml >/dev/null
          sudo apt-get install -y --reinstall ./$(ls fastcached_*.deb)
          grep -q 'local edit that must survive' /etc/fastcached/fastcached.yaml \
            || { echo "::error::upgrade discarded the local config edit"; exit 1; }
          sudo systemctl stop fastcached || true

      - name: "Verify removal deregisters the service"
        run: |
          set -euo pipefail
          sudo apt-get purge -y fastcached
          test ! -e /usr/lib/systemd/system/fastcached.service
          test ! -e /usr/lib/systemd/system/fastcache-compile-node.service
          test ! -e /usr/lib/systemd/system/fastcache-compile-node.socket
          # A leftover wants-symlink makes systemd log a failure on every boot.
          test ! -e /etc/systemd/system/multi-user.target.wants/fastcached.service
          # The socket is the unit that gets enabled, so it is the one that
          # leaves a symlink behind if the postrm forgets it.
          test ! -e /etc/systemd/system/sockets.target.wants/fastcache-compile-node.socket

      - name: "Upload packages"
        uses: actions/upload-artifact@v4
        with:
          name: fastcached-linux-packages
          path: |
            out/build/gcc-release/fastcached_*.deb
            out/build/gcc-release/fastcached-*.rpm
            out/build/gcc-release/fastcached-*.tar.gz
          if-no-files-found: error

  package-macos:
    name: "Package (macOS .pkg)"
    runs-on: macos-15
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-package-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-package-

      - name: "ccache"
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-package
          max-size: 256M

      - name: "Install build tools"
        # Note what is NOT installed: llvm. The plain `macos` job above builds
        # with Homebrew's LLVM and bakes its libc++ rpath into the binary, which
        # is fine for running tests on the runner and fatal for a package —
        # every user would need Homebrew LLVM at that exact path. This job uses
        # AppleClang and the system libc++ on purpose.
        run: brew install ninja openssl@3

      - name: "Select a modern Xcode"
        # The image ships several Xcodes but *defaults* to 16.4, whose libc++
        # predates std::jthread (LLVM 18) — the server loop then fails to
        # compile with "no type named 'jthread' in namespace 'std'". The plain
        # `macos` job dodges this with Homebrew's LLVM; this job cannot, because
        # that would bake a Homebrew rpath into the shipped binary. Selecting a
        # newer *Apple* toolchain fixes it with no source change and keeps the
        # system libc++.
        #
        # Newest-installed rather than a pinned version, so an image refresh
        # that retires one Xcode does not break the release path.
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          clang++ --version

      - name: "Verify the toolchain has the library features we need"
        # Asserted before the build so the failure names the cause. Otherwise a
        # toolchain regression surfaces as a wall of template errors deep in
        # ReactorServerLoop.cpp, which reads like a code bug rather than an
        # image change.
        run: |
          set -euo pipefail
          printf '#include <thread>\nint main(){ std::jthread t{[]{}}; }\n' > /tmp/probe.cpp
          clang++ -std=c++23 -mmacosx-version-min=13.3 -c /tmp/probe.cpp -o /dev/null \
            || { echo "::error::the selected Xcode's libc++ has no std::jthread (needs LLVM 18+)"; exit 1; }
          echo "std::jthread available"

      - name: "Decide whether this build can be signed"
        id: signing
        run: |
          # Gate on whether the secrets are actually reachable, not on the branch
          # name: GitHub withholds secrets from fork pull requests, which is the
          # real precondition. A branch test breaks every fork PR (codesign asked
          # for an identity in no keychain) *and* leaves the signing path
          # unexercised until after a merge.
          if [[ -n "$HAS_SIGNING_SECRETS" ]]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no signing secrets (fork PR?); building an unsigned package"
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          # Only its emptiness is observable here; the value never reaches the log.
          HAS_SIGNING_SECRETS: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}

      - name: "Install the Apple signing certificates"
        if: steps.signing.outputs.sign == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.INSTALLER_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Two different certificate types are needed and they are not
          # interchangeable: "Developer ID Application" signs the Mach-O
          # binaries and the .dmg, "Developer ID Installer" signs the .pkg.
          #
          # -T grants the tools access to the imported key and
          # set-key-partition-list records that grant in the key's ACL. Without
          # both, codesign blocks on a GUI confirmation that never arrives on a
          # runner, and the job hangs until its timeout rather than reporting
          # anything useful.
          import_p12() {
            path="$RUNNER_TEMP/$1.p12"
            printf '%s' "$2" | base64 --decode -o "$path"
            security import "$path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 \
                            -k "$KEYCHAIN_PATH" \
                            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
            rm -f "$path"
          }
          import_p12 application "$BUILD_CERTIFICATE_BASE64"
          import_p12 installer   "$INSTALLER_CERTIFICATE_BASE64"

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
                          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security find-identity -v "$KEYCHAIN_PATH"

      - name: "Store the notarization credentials"
        if: steps.signing.outputs.sign == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # An App Store Connect API key rather than an Apple ID and
          # app-specific password: it carries no personal account, can be scoped
          # to the Developer role, and is revocable on its own.
          set -eu
          KEY_PATH=$RUNNER_TEMP/notary-key.p8
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode -o "$KEY_PATH"
          xcrun notarytool store-credentials fastcached-notary \
                --key "$KEY_PATH" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID"
          # Everything downstream refers to the profile name only, so the key
          # material does not need to stay on disk.
          rm -f "$KEY_PATH"

      - name: "Configure"
        # -DCPM_USE_LOCAL_PACKAGES=OFF is what makes the package
        # redistributable: with it ON (the project default) CPM prefers
        # Homebrew's shared yaml-cpp and the daemon ends up linking
        # /opt/homebrew/opt/yaml-cpp/lib/libyaml-cpp.dylib, which exists on no
        # user's machine. OPENSSL_USE_STATIC_LIBS does the same job for TLS.
        run: |
          IDENTITY_APP=""
          IDENTITY_PKG=""
          NOTARIZE=OFF
          if [[ "${{ steps.signing.outputs.sign }}" == "true" ]]; then
            IDENTITY_APP="Developer ID Application: Christian Parpart (6T525MU9UR)"
            IDENTITY_PKG="Developer ID Installer: Christian Parpart (6T525MU9UR)"
            NOTARIZE=ON
          fi
          cmake -S . -B out/build/macos-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DFASTCACHED_BUILD_TESTS=OFF \
            -DFASTCACHED_PACKAGE_ROOT_PREFIX=ON \
            -DCPM_USE_LOCAL_PACKAGES=OFF \
            -DFASTCACHED_ENABLE_TLS=ON \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DFASTCACHED_MACOS_SIGN_IDENTITY_APP="$IDENTITY_APP" \
            -DFASTCACHED_MACOS_SIGN_IDENTITY_PKG="$IDENTITY_PKG" \
            -DFASTCACHED_MACOS_NOTARIZE="$NOTARIZE" \
            -DFASTCACHED_REQUIRE_EXACT_VERSION=${{ env.FASTCACHED_REQUIRE_EXACT_VERSION }}

      - name: "Build"
        run: cmake --build out/build/macos-package --target fastcached fastcache-cc fastcache-compile-node

      - name: "Verify the binaries are redistributable"
        # The regression that would otherwise ship silently: everything builds,
        # every test passes, and the package refuses to launch on any machine
        # without the build host's Homebrew prefix.
        run: |
          set -euo pipefail
          for tool in fastcached fastcache-cc fastcache-compile-node; do
            binary="out/build/macos-package/target/$tool"
            echo "== $tool"; otool -L "$binary"
            strays="$(otool -L "$binary" | tail -n +2 | awk '{print $1}' | grep -v '^/usr/lib/' || true)"
            if [[ -n "$strays" ]]; then
              echo "::error::$tool links libraries outside /usr/lib:"; echo "$strays"; exit 1
            fi
            # The deployment target floor: 13.3 because std::format of a float
            # calls std::to_chars, which the system libc++ only gained then.
            otool -l "$binary" | grep -q 'minos 13.3' \
              || { echo "::error::$tool was not built for the pinned deployment target"; exit 1; }
          done

      - name: "Package"
        # Notarization waits on Apple, hence the generous timeout.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # hdiutil intermittently hangs on GitHub runners while XProtect scans
          # the image being created; see actions/runner-images#7522.
          #
          # Killing it once here is not enough on its own: XProtect is
          # launchd-managed and relaunches on demand, and cpack signs two
          # binaries and builds three component packages before it ever reaches
          # hdiutil. So this keeps it down for as long as cpack runs, and
          # MacOSNotarizePkg.cmake bounds the hdiutil call itself — belt and
          # braces, because the failure mode is a wedge rather than an error and
          # costs the job's whole 30 minutes.
          sudo pkill -9 XProtect >/dev/null 2>&1 || true
          while pgrep XProtect >/dev/null; do sleep 3; done
          ( while :; do sudo pkill -9 XProtect >/dev/null 2>&1 || true; sleep 5; done ) &
          reaper=$!
          trap 'kill "$reaper" 2>/dev/null || true' EXIT
          cd out/build/macos-package && cpack -G "productbuild;TGZ"

      - name: "Inspect the .pkg payload"
        working-directory: out/build/macos-package
        run: |
          set -euo pipefail
          pkg=$(ls fastcached-*.pkg)
          echo "== choices"
          pkgutil --expand "$pkg" /tmp/pkgx
          grep -E '<choice id=' /tmp/pkgx/Distribution
          echo "== payload"
          pkgutil --payload-files "$pkg" | sort

          # The launchd registration must be offered as two separate, optional
          # choices, with the per-user agent preselected and the system daemon
          # not. A regression here silently changes what a click-through install
          # does to a user's machine.
          grep -q 'id="LaunchAgentChoice".*start_selected="true"' /tmp/pkgx/Distribution \
            || { echo "::error::the per-user agent is not preselected"; exit 1; }
          grep -q 'id="LaunchDaemonChoice".*start_selected="false"' /tmp/pkgx/Distribution \
            || { echo "::error::the system daemon is not opt-in"; exit 1; }

      - name: "Verify the signature and the notarization ticket"
        if: steps.signing.outputs.sign == 'true'
        working-directory: out/build/macos-package
        run: |
          set -euo pipefail
          pkg=$(ls fastcached-*.pkg)
          dmg=$(ls fastcached-*.dmg)
          pkgutil --check-signature "$pkg"
          # The exact decision Gatekeeper makes when the user double-clicks it.
          spctl --assess --verbose=4 --type install "$pkg"
          # Stapled separately from the image: a ticket on the .dmg does not
          # travel with a .pkg dragged out of it, leaving an offline install
          # dependent on Gatekeeper reaching Apple.
          xcrun stapler validate "$pkg"
          xcrun stapler validate "$dmg"

      - name: "Exercise the launchd integration"
        run: ./scripts/macos-service-e2e.sh --fastcached out/build/macos-package/target/fastcached

      - name: "Install, exercise and remove the package"
        # --scope daemon, not the installer's default: a runner has no console
        # user with a GUI session, so the per-user agent's postinstall correctly
        # does nothing and there would be no running service to assert against.
        # A LaunchDaemon needs no login, so this variant verifies the whole chain
        # non-interactively — service account created via dscl, job bootstrapped
        # into the system domain, running as _fastcached, serving on the port,
        # and every trace removed by the uninstaller. The agent's launchd path is
        # covered by the macos-service-e2e.sh step above.
        #
        # The script skips (77 → a failed step) without passwordless sudo. That
        # is deliberate: on a runner sudo is always available, so its absence
        # means the test did not run and should not pass quietly.
        run: |
          sudo -n true || { echo "::error::passwordless sudo unavailable; the install test cannot run"; exit 1; }
          ./scripts/macos-package-e2e.sh --scope daemon --pkg "$(ls out/build/macos-package/fastcached-*.pkg)"

      - name: "Upload packages"
        uses: actions/upload-artifact@v4
        with:
          name: fastcached-macos-packages
          path: |
            out/build/macos-package/fastcached-*.pkg
            out/build/macos-package/fastcached-*.dmg
            out/build/macos-package/fastcached-*.tar.gz
          if-no-files-found: error

  package-windows:
    name: "Package (Windows .msi)"
    runs-on: windows-2025
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Same backend, same version, same reasons as the `windows` job above, where
    # they are written out.
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache CPM packages"
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-package-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-package-

      - name: "sccache"
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: "Install ninja"
        run: choco install ninja --no-progress

      # CPack's WIX generator drives the WiX 4/5 `wix.exe`; the runner image
      # ships only the unrelated WiX 3.14. WiX 4 also split the installer UI
      # out into a separate extension package, and CPack always references it
      # (WixUI_InstallDir) — without it wix.exe fails with
      # "error WIX0144: The extension 'WixToolset.UI.wixext' could not be found".
      #
      # No Util extension: the ProgramData ACL uses the built-in PermissionEx
      # element (MsiLockPermissionsEx), not util:PermissionEx, so the fragment
      # needs nothing here beyond what CPack already requires.
      - name: "Install WiX"
        run: |
          dotnet tool install --global wix --version 5.*
          wix extension add --global WixToolset.UI.wixext/5.0.2

      # Same toolset pin as the windows build matrix; see the comment there.
      - name: "Setup MSVC dev environment"
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: "14.44"

      - name: "Configure"
        # FASTCACHED_REQUIRE_EXACT_VERSION comes from the workflow-level env: block,
        # which is where the "only on a tag run" reasoning is written down.
        run: cmake --preset cl-release -DFASTCACHED_BUILD_TESTS=OFF -DFASTCACHED_REQUIRE_EXACT_VERSION=${{ env.FASTCACHED_REQUIRE_EXACT_VERSION }}

      - name: "Build"
        run: cmake --build --preset cl-release --target fastcached fastcache-cc fastcache-compile-node

      # Same assertion as the `windows` job, where the reasoning is written out.
      - name: "Assert sccache actually handled the build"
        shell: pwsh
        run: |
          & $env:SCCACHE_PATH --show-stats
          $stats = & $env:SCCACHE_PATH --show-stats --stats-format=json | ConvertFrom-Json
          if ($null -eq $stats.stats.compile_requests -or $null -eq $stats.cache_location) {
            Write-Host "::error::sccache reported no compile_requests/cache_location field; the assertion below cannot run and a null never matches, so this is a refusal rather than a pass"
            exit 1
          }
          if ($stats.stats.compile_requests -eq 0) {
            Write-Host "::error::sccache handled 0 compile requests; the launcher is not wired in"
            exit 1
          }
          if ($stats.cache_location -match 'Local disk') {
            Write-Host "::error::sccache is caching into '$($stats.cache_location)', which is deleted with this runner; SCCACHE_GHA_ENABLED did not take effect"
            exit 1
          }

      # On failure CPack only says "check wix.log", which lives in the build
      # tree and is otherwise discarded with the runner — so the actual WiX
      # diagnostic never reaches the job output. Dump it here.
      - name: "Package"
        shell: pwsh
        working-directory: out/build/cl-release
        run: |
          cpack -G "WIX;ZIP"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $log = '_CPack_Packages/win64/WIX/wix.log'
            if (Test-Path $log) {
              Write-Host "===== wix.log ====="
              Get-Content $log
            } else {
              Write-Host "no wix.log at $log"
            }
          }
          exit $code

      # Install silently, then assert the MSI really registered an auto-start
      # service and started it — the behaviour the installer promises.
      - name: "Install the MSI and verify the service"
        shell: pwsh
        working-directory: out/build/cl-release
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem -Filter *.msi | Select-Object -First 1).FullName
          Write-Host "Installing $msi"
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', "`"$msi`"", '/qn', '/l*v', 'install.log')

          # A blind tail of a verbose MSI log is useless — the last 80 lines are
          # just the property dump. Select the lines that name the failure: the
          # action trace, custom-action returns, and error records.
          function Show-InstallLog {
            Write-Host "===== install.log (relevant lines) ====="
            Select-String -Path install.log -Pattern `
              'Action (start|ended)','CustomAction','FastCached','returned actual error','Note: 1: 1(4|7)[0-9][0-9]','Installation (success|failed)','error' `
              | Select-Object -Last 60 | ForEach-Object { $_.Line }
          }

          if ($p.ExitCode -ne 0) {
            Show-InstallLog
            throw "msiexec failed with $($p.ExitCode)"
          }

          $svc = Get-Service -Name FastCached -ErrorAction SilentlyContinue
          if (-not $svc) { Show-InstallLog; throw 'FastCached service was not registered' }

          $start = (Get-CimInstance Win32_Service -Filter "Name='FastCached'").StartMode
          if ($start -ne 'Auto') { throw "expected auto-start, got $start" }

          for ($i = 0; $i -lt 30 -and (Get-Service FastCached).Status -ne 'Running'; $i++) { Start-Sleep 1 }
          if ((Get-Service FastCached).Status -ne 'Running') { throw 'service did not start' }

          # The identity it logs on as. Told nothing, CreateService uses LocalSystem
          # -- unrestricted access to every local resource, and a member of the local
          # Administrators group. A cache daemon listening on a socket needs none of
          # it. Asserted here because this is a SHIPPED service whose identity
          # changed: if the virtual account cannot log on, the service simply never
          # starts, and the check above would be the only thing that noticed.
          $svc = Get-CimInstance Win32_Service -Filter "Name='FastCached'"
          if ($svc.StartName -ne 'NT SERVICE\FastCached') {
            Show-InstallLog
            throw "daemon runs as '$($svc.StartName)', expected NT SERVICE\FastCached"
          }

          # Running is not serving. The virtual account has to be able to read the
          # config it was seeded and bind its port, and only an actual round trip
          # says so -- a job can reach Running and then fail its first request.
          $reply = ''
          for ($i = 0; $i -lt 30 -and -not $reply; $i++) {
            try {
              $c = New-Object Net.Sockets.TcpClient('127.0.0.1', 6674)
              $st = $c.GetStream()
              $w = New-Object IO.StreamWriter($st); $w.NewLine = "`r`n"; $w.AutoFlush = $true
              $w.WriteLine('set k 0 0 5'); $w.WriteLine('hello'); $w.WriteLine('get k')
              $r = New-Object IO.StreamReader($st)
              $c.ReceiveTimeout = 5000
              $reply = $r.ReadLine() + '|' + $r.ReadLine() + '|' + $r.ReadLine()
              $c.Close()
            } catch { Start-Sleep 1 }
          }
          if ($reply -notmatch 'STORED' -or $reply -notmatch 'hello') {
            Show-InstallLog
            throw "daemon did not serve on 6674 under its virtual account: '$reply'"
          }
          Write-Host "daemon serving as $($svc.StartName)"

      # The compile worker registers itself; the MSI never does. What is asserted
      # here is the identity it registers UNDER: told nothing, CreateService logs a
      # service on as LocalSystem -- the whole machine -- and this process compiles
      # input that arrived over the network. The macOS half of the same decision is
      # the fastcache-node account (issue #87); on Windows it is a virtual account,
      # which the SCM derives from the service name and creates itself.
      #
      # Run against the built binary rather than the MSI payload because the MSI
      # deliberately registers no worker: it has no scheduler address or toolchain
      # list to register one with.
      - name: "Verify the compile worker does not register as LocalSystem"
        shell: pwsh
        working-directory: out/build/cl-release
        run: |
          $ErrorActionPreference = 'Stop'
          $node = Resolve-Path 'target/fastcache-compile-node.exe'
          $cacheDir = Join-Path $env:RUNNER_TEMP 'fastcache-node-cache'
          $toolchain = (Get-Command cl.exe).Source

          # --listen-node is NAMED, and it has to be since #290 stage 3.
          #
          # A node opens exactly one 0xFC port, defaulting to 127.0.0.1:6674 -- and
          # the step above leaves a `fastcached` serving on 6674 for the rest of the
          # job, where the Linux packaging job stops its daemon before installing the
          # worker. Left defaulted, the worker's only port is a port it cannot have,
          # and a bind it cannot make is now a startup refusal rather than a warning:
          # before stage 3 a worker losing that port kept a compile port of its own
          # and carried on, so the collision was invisible here.
          #
          # 6676, matching --advertise, so the two agree -- a loopback bind under a
          # loopback advertise is the coherent single-machine shape and passes the
          # startup table. Whether this job should co-install a daemon and a worker
          # on one machine at all is a real question (#229 says it should not), and
          # not one this step is the place to settle.
          & $node --install-service `
              --scheduler=127.0.0.1:6675 `
              --listen-node=127.0.0.1:6676 `
              --advertise=127.0.0.1:6676 `
              --cache-dir="$cacheDir" `
              --toolchain="$toolchain"
          if ($LASTEXITCODE -ne 0) { throw "worker --install-service failed with $LASTEXITCODE" }

          try {
            $svc = Get-CimInstance Win32_Service -Filter "Name='FastCacheCompileNode'"
            if (-not $svc) { throw 'FastCacheCompileNode was not registered' }

            # The assertion this step exists for.
            if ($svc.StartName -ne 'NT SERVICE\FastCacheCompileNode') {
              throw "worker runs as '$($svc.StartName)', expected NT SERVICE\FastCacheCompileNode"
            }

            # A virtual account cannot write a directory an administrator created,
            # which LocalSystem never noticed. The install grants it explicitly, and
            # the trustee only resolves once the service exists -- so this also pins
            # that the grant happens after CreateService and not before.
            $granted = (Get-Acl $cacheDir).Access | Where-Object {
              $_.IdentityReference.Value -eq 'NT SERVICE\FastCacheCompileNode' -and $_.AccessControlType -eq 'Allow'
            }
            if (-not $granted) { throw "$cacheDir carries no ACE for the worker's virtual account" }

            # And it must actually run under that identity. A registration that
            # cannot start is the failure this project refuses at install time, so
            # it must not be introduced by the installer either. The heartbeat
            # retries in a background thread, so an unreachable scheduler does not
            # stop the service.
            # A failed start used to report one word -- `Stopped` -- for every
            # possible cause, which is a status rather than a reason and sent the
            # last failure here to log archaeology for a two-line answer. Every
            # branch below is diagnostic and best-effort: the throw is what fails
            # the step, and a diagnostic that cannot run must not mask it.
            Start-Service FastCacheCompileNode -ErrorAction SilentlyContinue
            for ($i = 0; $i -lt 30 -and (Get-Service FastCacheCompileNode).Status -ne 'Running'; $i++) { Start-Sleep 1 }
            if ((Get-Service FastCacheCompileNode).Status -ne 'Running') {
              $status = (Get-Service FastCacheCompileNode).Status

              # What was actually registered. A registration replays this command
              # line at every start, so it is the first thing to read and the one
              # thing a status word can never carry.
              $registered = (Get-CimInstance Win32_Service -Filter "Name='FastCacheCompileNode'").PathName
              Write-Host "registered PathName: $registered"

              # The sharpest version: run what was registered, in the foreground,
              # so the refusal TEXT appears instead of a status. `--daemon` is
              # stripped because it means "run under the SCM" and would fail for a
              # different reason than the one being diagnosed.
              try {
                # A token is a run of unquoted characters and quoted sections, not
                # `"..."|\S+` -- that alternation takes \S+ first and splits
                # `--cache-dir="C:\dir with space"` into three arguments.
                $argv = ([regex]::Matches($registered, '(?:[^\s"]|"[^"]*")+') | ForEach-Object { $_.Value -replace '"','' })
                $exe = $argv[0]
                $rest = @($argv | Select-Object -Skip 1 | Where-Object { $_ -ne '--daemon' })
                $out = Join-Path $env:RUNNER_TEMP 'node-foreground.log'
                $proc = Start-Process -FilePath $exe -ArgumentList $rest -PassThru -NoNewWindow `
                          -RedirectStandardOutput $out -RedirectStandardError "$out.err"
                if (-not $proc.WaitForExit(15000)) { $proc.Kill(); Write-Host 'foreground run did not exit; it started cleanly' }
                Write-Host '--- foreground stdout ---'; Get-Content $out -ErrorAction SilentlyContinue
                Write-Host '--- foreground stderr ---'; Get-Content "$out.err" -ErrorAction SilentlyContinue
              } catch { Write-Host "foreground reproduction failed: $_" }

              # And what the SCM itself recorded, which covers the causes that never
              # reach the process at all -- a missing account, a denied logon right.
              try {
                Get-WinEvent -FilterHashtable @{ LogName = 'System'; StartTime = (Get-Date).AddMinutes(-5) } `
                  -ErrorAction SilentlyContinue |
                  Where-Object { $_.Message -match 'FastCacheCompileNode' } |
                  Select-Object -First 10 TimeCreated, Id, Message | Format-List
              } catch { Write-Host "event log read failed: $_" }

              throw "worker did not start under its virtual account: $status"
            }
            Stop-Service FastCacheCompileNode -Force
          }
          finally {
            & $node --uninstall-service
          }

          if (Get-Service -Name FastCacheCompileNode -ErrorAction SilentlyContinue) {
            throw 'FastCacheCompileNode survived --uninstall-service'
          }

      # The configuration half of the same promise, which nothing asserted
      # before: the .deb/.rpm conffile and the .pkg postinstall are both checked
      # end to end below and on macOS, while the MSI's seeding action is
      # Return="ignore" and therefore fails in complete silence. A seed that did
      # not happen leaves a service running on built-in defaults and an operator
      # editing a file that is not there.
      - name: "Verify the seeded configuration and its permissions"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:ProgramData\fastcached"
          $cfg = "$dir\fastcached.yaml"

          # Seeding happened at all. This is also the assertion that catches
          # %ProgramData% being absent from the LocalSystem service environment,
          # which would make both the seed and the daemon's own lookup no-ops.
          if (-not (Test-Path $cfg)) { throw "installer did not seed $cfg" }
          if (-not (Select-String -Path $cfg -Pattern '^#port:' -Quiet)) {
            throw "$cfg does not look like the shipped template"
          }

          # The ACL, by SID rather than account name so the check is not itself
          # wrong on a non-English runner. A standard account able to create
          # files here owns the configuration of a LocalSystem service.
          $acl = Get-Acl $dir
          if (-not $acl.AreAccessRulesProtected) {
            throw "$dir still inherits from C:\ProgramData, which grants BUILTIN\Users create-file"
          }

          $planting = [Security.AccessControl.FileSystemRights]::CreateFiles `
                    -bor [Security.AccessControl.FileSystemRights]::CreateDirectories `
                    -bor [Security.AccessControl.FileSystemRights]::Write `
                    -bor [Security.AccessControl.FileSystemRights]::ChangePermissions `
                    -bor [Security.AccessControl.FileSystemRights]::TakeOwnership
          $broad = @('S-1-1-0', 'S-1-5-11', 'S-1-5-32-545', 'S-1-5-4', 'S-1-5-32-546')

          # Ask for the rules as SIDs rather than translating names afterwards:
          # entries like ALL APPLICATION PACKAGES have no account to resolve to,
          # and Translate() throws on them rather than returning nothing, which
          # would abort this check instead of passing it.
          foreach ($rule in $acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier])) {
            if ($rule.AccessControlType -ne 'Allow') { continue }
            $sid = $rule.IdentityReference.Value
            if ($broad -contains $sid -and ($rule.FileSystemRights -band $planting)) {
              throw "$dir grants $sid $($rule.FileSystemRights); a standard account could plant a config there"
            }
          }

          # An owner keeps ChangePermissions whatever the entries say.
          $owner = $acl.GetOwner([Security.Principal.SecurityIdentifier]).Value
          if ($owner -notin @('S-1-5-18', 'S-1-5-32-544')) {
            throw "$dir is owned by $owner, not by SYSTEM or Administrators"
          }

          Write-Host "seeded $cfg"
          Write-Host "  owner: $owner  protected: $($acl.AreAccessRulesProtected)"

      # Seed-once, the property the whole arrangement exists for: an MSI
      # overwrites its payload on every install, so the live config is kept out
      # of the payload and copied in only when absent. The .deb/.rpm equivalent
      # is asserted the same way further up; macOS in macos-package-e2e.sh.
      - name: "Verify a reinstall keeps operator edits"
        shell: pwsh
        working-directory: out/build/cl-release
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = "$env:ProgramData\fastcached\fastcached.yaml"
          $marker = '# local edit that must survive'
          Add-Content -Path $cfg -Value $marker

          $msi = (Get-ChildItem -Filter *.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', "`"$msi`"", '/qn', 'REINSTALL=ALL', 'REINSTALLMODE=vomus')
          if ($p.ExitCode -ne 0) { throw "reinstall failed with $($p.ExitCode)" }

          if (-not (Select-String -Path $cfg -Pattern ([regex]::Escape($marker)) -Quiet)) {
            throw 'the reinstall overwrote the operator edit'
          }

          # The upgrade path for the service identity. A reinstall re-registers the
          # daemon, so this is where a change to what it logs on as would strand an
          # existing installation -- registered, and unable to start.
          for ($i = 0; $i -lt 30 -and (Get-Service FastCached).Status -ne 'Running'; $i++) { Start-Sleep 1 }
          if ((Get-Service FastCached).Status -ne 'Running') {
            throw 'the daemon did not come back up after a reinstall'
          }
          $svc = Get-CimInstance Win32_Service -Filter "Name='FastCached'"
          if ($svc.StartName -ne 'NT SERVICE\FastCached') {
            throw "after reinstall the daemon runs as '$($svc.StartName)'"
          }

      - name: "Uninstall and verify the service is gone"
        shell: pwsh
        working-directory: out/build/cl-release
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem -Filter *.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/x', "`"$msi`"", '/qn')
          if ($p.ExitCode -ne 0) { throw "uninstall failed with $($p.ExitCode)" }
          if (Get-Service -Name FastCached -ErrorAction SilentlyContinue) {
            throw 'FastCached service survived uninstall'
          }

          # Documented behaviour on every platform: the configuration is the
          # operator's, not the package's, so it outlives the package.
          if (-not (Test-Path "$env:ProgramData\fastcached\fastcached.yaml")) {
            throw 'uninstall removed the configuration'
          }

      # Named fastcached-<platform>-packages like the Linux and macOS jobs, so the
      # release job below collects all three with one pattern and a new platform
      # is a new upload row rather than an edit there.
      - name: "Upload the MSI and the ZIP"
        uses: actions/upload-artifact@v4
        with:
          name: fastcached-windows-packages
          path: |
            out/build/cl-release/*.msi
            out/build/cl-release/*.zip
          if-no-files-found: error

  # The release gate. Its contract is narrow and total: it runs only for a tag,
  # only after every other job in this workflow is green, and it refuses to create
  # anything unless every platform's package is present and named after the tag
  # that triggered the build. What it creates is always a DRAFT — nothing here
  # publishes a release automatically; /publish-release does that, by hand.
  release:
    name: "Draft GitHub release"
    # The trigger already restricts tag runs to vX.Y.Z. This is what keeps the job
    # off every branch and pull-request run; GitHub expressions have no regex, so
    # the shape check stays in the `on:` filter and this stays a prefix test.
    if: startsWith(github.ref, 'refs/tags/v')
    # Every other job in this workflow. A job missing from this list is a job
    # whose failure would not stop a release, so `check-release-gate` — itself a
    # row here — asserts the list still covers the whole workflow, and does so on
    # every push and pull request rather than only when a tag is already pushed.
    needs:
      - changes
      - check-clang-format
      - check-release-gate
      - linux
      - clang-tidy
      - clang-asan-ubsan
      - clang-tsan
      - coverage
      - macos
      - docker
      - sccache-smoke-memcached-text
      - sccache-smoke-memcached-binary
      - sccache-smoke-redis
      - fastcache-cc-smoke
      - windows
      - compile-cache-e2e-linux
      - compile-cache-e2e-windows
      - package-linux
      - package-macos
      - package-windows
    runs-on: ubuntu-24.04
    # The only job here needing more than the repository's default read-only
    # token: creating a release writes `contents`. Without this the release step
    # fails with a bare 403 rather than with anything that names the cause.
    permissions:
      contents: write
    steps:
      # Checked out for one reason: the asset list at the end of this job is the
      # single source of truth for what a release consists of, and the assertion
      # below reads it back rather than restating it. No history needed.
      - uses: actions/checkout@v4

      # Every packaging job uploads under fastcached-<platform>-packages. The
      # archives do not collide in a flat directory: CPack stamps the system name
      # into each (…-Linux-x86_64.tar.gz vs …-Darwin-arm64.tar.gz), which is also
      # why the asset list below names them separately and so catches one going
      # missing.
      - name: "Download every platform's packages"
        uses: actions/download-artifact@v4
        with:
          pattern: fastcached-*-packages
          merge-multiple: true
          path: dist

      # The version now comes from `git describe`, so a checkout that cannot see
      # the tag produces a fallback version and packages named after a release
      # nobody cut — a defect invisible in every green job above and observable
      # only in the filenames. So the filenames are what gets asserted. The
      # packaging jobs also configure with -DFASTCACHED_REQUIRE_EXACT_VERSION=ON
      # on a tag run, which fails earlier and closer to the cause; this is the
      # backstop that no packaging change can bypass.
      #
      # The expectation table is not restated here: it is read back out of this
      # job's own asset list with the same extractor /publish-release uses, so
      # there is exactly one such list in the repository.
      - name: "Assert the package set is complete and named after the tag"
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          version="${TAG#v}"
          [[ -n "$version" ]] || { echo "::error::empty tag name"; exit 1; }

          mapfile -t patterns < <(awk '
              /files:[[:space:]]*\|/ { collecting = 1; next }
              collecting {
                  if ($0 ~ /^[[:space:]]*#/) next
                  if ($0 !~ /^[[:space:]]*[*a-zA-Z0-9._-]+/) { collecting = 0; next }
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "")
                  if (length($0)) print
              }' .github/workflows/build.yml)

          (( ${#patterns[@]} )) || { echo "::error::no asset globs found in this workflow"; exit 1; }

          status=0
          : > "$RUNNER_TEMP/attached.txt"
          {
            echo "### Release assets for \`$TAG\`"
            echo
            echo "| expected | asset | bytes |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for pattern in "${patterns[@]}"; do
            # A glob is a filename pattern and nothing else. Whitespace or a colon
            # means the extractor ran past the end of the asset list and swallowed
            # a sibling key — see the warning above that list.
            if [[ "$pattern" == *[[:space:]:]* ]]; then
              echo "::error::'$pattern' is not a file glob: the asset list must stay the LAST key of the action's with: mapping"
              status=1; continue
            fi

            hits=( $pattern )
            if (( ${#hits[@]} != 1 )); then
              echo "::error::$pattern matched ${#hits[@]} files, expected exactly 1: ${hits[*]-}"
              echo "| \`$pattern\` | **${#hits[@]} matches** | |" >> "$GITHUB_STEP_SUMMARY"
              status=1; continue
            fi

            file="${hits[0]}"
            name="${file##*/}"

            # `fastcached-<version>` followed by a separator, not a substring test:
            # 0.1.1 would otherwise be satisfied by a 0.1.10 package.
            case "$name" in
              fastcached-"$version"[-_.]* | fastcached_"$version"[-_.]*) ;;
              *)
                echo "::error::$name does not carry the tag's version ($version): the build used a fallback version, so that checkout could not see the tag"
                echo "| \`$pattern\` | $name | **wrong version** |" >> "$GITHUB_STEP_SUMMARY"
                status=1; continue
                ;;
            esac

            [[ -s "$file" ]] || { echo "::error::$name is empty"; status=1; continue; }

            printf '%s\n' "$file" >> "$RUNNER_TEMP/attached.txt"
            echo "| \`$pattern\` | $name | $(stat -c %s "$file") |" >> "$GITHUB_STEP_SUMMARY"
          done

          # Nothing that was built may be left out. An artifact no glob attaches is
          # a platform silently missing from the release page — the same defect as
          # a missing package, wearing the opposite disguise.
          find dist -type f | sort > "$RUNNER_TEMP/downloaded.txt"
          sort -o "$RUNNER_TEMP/attached.txt" "$RUNNER_TEMP/attached.txt"
          orphans="$(comm -23 "$RUNNER_TEMP/downloaded.txt" "$RUNNER_TEMP/attached.txt" || true)"
          if [[ -n "$orphans" ]]; then
            echo "::error::downloaded but attached by no glob:"
            echo "$orphans"
            status=1
          fi

          exit $status

      # softprops/action-gh-release rather than `gh release upload`:
      # /publish-release discovers what a release is *supposed* to contain by
      # parsing the literal asset list below, and a runtime-built upload list
      # would leave it with nothing to verify against.
      #
      # DO NOT ADD A KEY BELOW THE ASSET LIST, AND DO NOT REORDER THIS MAPPING.
      # That verifier collects every line after the list header and stops at the
      # first line that does not look like a filename — and `draft: true` looks
      # exactly like one. A key moved below the list is collected as a glob that
      # can never match, and verification then blocks forever on a phantom asset.
      # The list stays last, terminated by the end of the file. The assertion step
      # above fails the build if this is ever "tidied"; that is its second job.
      - name: "Create the draft release"
        # Pinned to a full commit SHA rather than the mutable @v2 tag, because this
        # is the only step in the workflow holding a `contents: write` token: a tag
        # is repointable by the action's owner or by anyone who takes that account,
        # and the next tag push would run the new code with rights to write
        # releases, tags and repository contents. The SHA below is v2.6.2, which is
        # what @v2 resolved to when this was validated. Upgrading is a deliberate
        # edit — read the changelog, bump the SHA and the version in this comment
        # together. (Upstream has since moved to v3.x; that is a major bump whose
        # input contract needs checking, so it is not taken here by default.)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: "fastcached ${{ github.ref_name }}"
          # The whole point: CI assembles the release, a human publishes it with
          # /publish-release once the assets have been verified.
          draft: true
          # No changelog file in this repository, so the body is GitHub's
          # generated commit summary — which /publish-release requires to be
          # non-empty.
          generate_release_notes: true
          # A glob matching nothing is a platform with no download. The assertion
          # step catches that first; this makes the action itself refuse rather
          # than warn, so neither path can leave a partial draft behind.
          fail_on_unmatched_files: true
          # One row per shipped artifact, each specific enough that a single
          # platform dropping out breaks exactly one row: a shared
          # `fastcached-*.tar.gz` would be satisfied by the Linux archive alone
          # while macOS shipped nothing. macOS is arm64-only because the runner is
          # Apple Silicon, so the day an x86_64 package appears this list gains a
          # row. The version is deliberately a wildcard — it is pinned to the tag
          # by the assertion step above, which can say so in its own words.
          files: |
            dist/fastcached_*_amd64.deb
            dist/fastcached-*.x86_64.rpm
            dist/fastcached-*-Linux-x86_64.tar.gz
            dist/fastcached-*-Darwin-arm64.pkg
            dist/fastcached-*-Darwin-arm64.dmg
            dist/fastcached-*-Darwin-arm64.tar.gz
            dist/fastcached-*-Windows-AMD64.msi
            dist/fastcached-*-Windows-AMD64.zip
