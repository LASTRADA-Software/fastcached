# Publishes the MkDocs site to GitHub Pages.
#
# On a pull request the site is only BUILT, never deployed: `mkdocs build
# --strict` turns a broken link, a missing nav entry, or an unresolved snippet
# into a failing status check, so documentation rot is caught in review rather
# than in production. Pushes to master build and deploy.
#
# One-time repository setup: Settings -> Pages -> Source = "GitHub Actions".
name: Documentation

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight deployment: a half-published site is worse than a
# slightly stale one. Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: "Build site (strict)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: "Install MkDocs"
        run: pip install -r docs/requirements.txt

      # --strict is the point of this job: warnings become errors.
      - name: "Build"
        run: mkdocs build --strict

      - name: "Upload artifact"
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: "Deploy to Pages"
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Deploy"
        id: deployment
        uses: actions/deploy-pages@v4
