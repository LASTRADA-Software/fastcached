# Publishes the MkDocs site to GitHub Pages.
#
# On a pull request the site is only BUILT, never deployed: `mkdocs build
# --strict` turns a broken link, a missing nav entry, or an unresolved snippet
# into a failing status check, so documentation rot is caught in review rather
# than in production. Pushes to master build and deploy.
#
# One-time repository setup: Settings -> Pages -> Source = "GitHub Actions".
name: Documentation

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# The group carries the ref, and that is what keeps a pull request's strict build
# out of the deployment queue. A bare `pages` group is a single global lane over
# both jobs below, so a documentation check could not start until every earlier
# run had finished — and a run held at a concurrency gate creates *no job records
# at all*, so the check does not appear on the pull request as queued, it does not
# appear at all. That is indistinguishable from a workflow nobody triggered, which
# is the shape it was found in: PR #88's Documentation check was missing for hours
# while a master deploy held `pages` waiting for a runner, and the pull request
# reported no documentation status of any kind rather than a pending one.
#
# `cancel-in-progress` stays false wherever this run can deploy. Every push to
# master shares one group, so deployments still serialize and are still never
# cancelled — a half-published site is worse than a slightly stale one. A pull
# request only ever builds (the deploy job below is gated on the event), so
# superseding one costs nothing and hands a runner slot back to the queue, which
# is the same trade build.yml makes for the same reason.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: "Build site (strict)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: "Install MkDocs"
        run: pip install -r docs/requirements.txt

      # --strict is the point of this job: warnings become errors.
      - name: "Build"
        run: mkdocs build --strict

      - name: "Upload artifact"
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: "Deploy to Pages"
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Deploy"
        id: deployment
        uses: actions/deploy-pages@v4
